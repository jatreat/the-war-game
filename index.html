<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The War Game — York's Crossing • Pine Island Camp</title>
<style>
  :root{
    --bg:#0f1a14; --card:#ffffff; --card2:#f3f5f2; --ink:#16211b; --ink-soft:#5b665f; --line:#dfe4de;
    --grey:#5d6773; --grey-dark:#3b434d; --blue:#2563eb; --blue-dark:#1d48b8;
    --gold:#f59e0b; --red:#e0412f; --green:#1f9d55; --field:#6fbf5a;
    --r:16px; --shadow:0 10px 30px rgba(0,0,0,.28);
    --font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
  body{font-family:var(--font);color:var(--ink)}
  .script{font-family:var(--font)}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
  input,textarea{-webkit-user-select:text;user-select:text}
  button{font-family:var(--font)}

  /* ---------- top bar ---------- */
  #topbar{position:absolute;top:0;left:0;right:0;height:58px;z-index:20;display:flex;align-items:stretch;
    background:#132219;color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.35);font-size:15px;
    padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);box-sizing:content-box}
  .tb-cell{display:flex;align-items:center;gap:8px;padding:0 12px;white-space:nowrap}
  .tb-flex{flex:1;justify-content:center}
  .army-chip{display:flex;align-items:center;gap:7px;font-weight:800;letter-spacing:.3px}
  .pennant{width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:inline-block;font-size:0}
  .pennant.g{background:var(--grey)} .pennant.b{background:var(--blue)}
  .army-chip .aname{font-size:12px;opacity:.8}
  .bigscore{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;min-width:40px;text-align:center}
  #q-label{font-weight:800;font-size:13px;opacity:.75;letter-spacing:.3px}
  #phase-label{font-weight:700;font-size:14px;color:#ffd166}
  #clock{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.1);padding:4px 10px;border-radius:10px}
  .tb-btn{cursor:pointer;border:none;background:rgba(255,255,255,.12);border-radius:10px;padding:6px 11px;
    font-size:14px;font-weight:800;color:#fff;min-height:34px}
  .tb-btn:hover{background:rgba(255,255,255,.2)}
  .tb-btn.on{background:var(--gold);color:#1b1300}
  #speed-ctl{display:flex;gap:4px}

  /* ---------- bottom bar ---------- */
  #botbar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:10px;
    padding:8px 14px;background:#132219;color:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.35);min-height:58px;flex-wrap:wrap;
    padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));padding-bottom:max(8px,env(safe-area-inset-bottom))}
  #sel-info{font-size:14px;font-weight:800;min-width:210px}
  #sel-sub{font-size:12.5px;font-weight:600;color:#b8c7bd}
  .act-btn{cursor:pointer;border:none;background:rgba(255,255,255,.12);border-radius:12px;padding:9px 14px;
    font-size:14px;font-weight:800;color:#fff}
  .act-btn:hover{background:rgba(255,255,255,.2)} .act-btn:active{transform:scale(.97)}
  .act-btn.armed{background:var(--gold);color:#1b1300}
  .act-btn:disabled{opacity:.4;cursor:default}
  .key-hint{font-size:10px;opacity:.6;font-weight:600}
  #tipline{flex-basis:100%;font-size:13px;font-weight:600;color:#ffd166;padding-top:2px}
  #tipline:empty{display:none}

  /* ---------- play-by-play log ---------- */
  #log{position:absolute;right:10px;top:66px;width:300px;max-height:42vh;z-index:15;overflow-y:auto;
    background:rgba(255,255,255,.96);border-radius:var(--r);padding:10px 12px;
    font-size:12.5px;line-height:1.45;box-shadow:var(--shadow)}
  #log h4{font-size:11px;font-weight:900;letter-spacing:1.2px;color:var(--ink-soft);margin-bottom:6px;cursor:pointer}
  #log.collapsed #log-entries{display:none}
  #log.collapsed h4{margin-bottom:0}
  #log .ent{margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid var(--line)}
  #log .t{opacity:.5;font-variant-numeric:tabular-nums;margin-right:5px;font-size:11px;font-weight:700}
  #log .grey{color:var(--grey-dark);font-weight:800} #log .blue{color:var(--blue-dark);font-weight:800}
  #log .ump{color:var(--red);font-weight:800} #log .flav{opacity:.75}
  #log-toggle{position:absolute;right:10px;top:66px;z-index:16}

  /* ---------- banners ---------- */
  #banner{position:absolute;left:50%;top:16%;transform:translateX(-50%);z-index:24;pointer-events:none;
    text-align:center;transition:opacity .3s,transform .3s;opacity:0}
  #banner.show{opacity:1}
  #banner .b-main{font-size:32px;font-weight:900;color:#fff;background:#132219;display:inline-block;
    padding:10px 30px;border-radius:999px;letter-spacing:.5px;box-shadow:var(--shadow)}
  #banner .b-sub{font-size:16px;font-weight:700;margin-top:8px;color:#132219;background:#ffd166;
    display:inline-block;padding:5px 16px;border-radius:999px}

  /* ---------- overlay screens ---------- */
  #overlay{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:rgba(10,20,14,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #overlay.hidden{display:none}
  #overlay{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #overlay .sheet{max-height:calc(100% - 16px)}
  #overlay .sheet{animation:sheetIn .28s ease-out}
  @keyframes sheetIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  #gatepanel:not(.hidden){animation:panelIn .18s ease-out}
  @keyframes panelIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
  @media (prefers-reduced-motion:reduce){#overlay .sheet,#gatepanel:not(.hidden){animation:none}}
  .sheet{background:var(--card);border-radius:24px;max-width:620px;width:92%;
    max-height:92vh;overflow-y:auto;padding:28px 32px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .sheet h1{font-size:40px;font-weight:900;text-align:center;letter-spacing:-.5px;margin-bottom:2px}
  .sheet h2.script{font-size:24px;font-weight:900;text-align:center;margin-bottom:8px;color:var(--ink)}
  .sheet .rule-line{border:none;border-top:2px solid var(--line);margin:14px auto;width:100%}
  .sheet p{font-size:15px;line-height:1.5;margin-bottom:10px}
  .sheet .fine{font-size:13px;color:var(--ink-soft)}
  .kicker{text-align:center;font-size:12px;font-weight:900;letter-spacing:2px;color:var(--green);text-transform:uppercase}
  .pick-row{display:flex;gap:12px;justify-content:center;margin:16px 0}
  .army-card{flex:1;max-width:270px;border-radius:18px;padding:14px;cursor:pointer;color:#fff;
    text-align:center;transition:transform .12s, box-shadow .12s;opacity:.55;border:3px solid transparent}
  #pick-G{background:linear-gradient(160deg,#6b7684,#3b434d)} #pick-B{background:linear-gradient(160deg,#3b82f6,#1d48b8)}
  .army-card:hover{transform:translateY(-2px)}
  .army-card.sel{opacity:1;border-color:var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .army-card h3{font-size:22px;font-weight:900;letter-spacing:.5px}
  .army-card .gen{font-size:12.5px;font-weight:600;opacity:.85;margin:4px 0 0}
  .army-card .desc{display:none}
  .flagbox{display:none}
  .diff-row{display:flex;gap:6px;justify-content:center;margin:6px 0 12px;background:var(--card2);padding:4px;border-radius:14px}
  .diff-btn{flex:1;border:none;background:none;border-radius:11px;padding:9px 10px;
    cursor:pointer;font-size:14px;font-weight:800;color:var(--ink-soft)}
  .diff-btn.sel{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .go-btn{display:block;margin:14px auto 0;padding:15px 48px;font-size:19px;font-weight:900;letter-spacing:.5px;
    background:var(--green);color:#fff;border:none;border-radius:999px;cursor:pointer;
    box-shadow:0 6px 0 #157040,0 10px 20px rgba(31,157,85,.35)}
  .go-btn:hover{filter:brightness(1.05)}
  .go-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #157040}
  .score-table{width:100%;border-collapse:separate;border-spacing:0;margin:10px 0;font-size:15px;border-radius:14px;overflow:hidden;background:var(--card2)}
  .score-table th,.score-table td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)}
  .score-table th{font-size:12px;letter-spacing:1px;color:var(--ink-soft)}
  .quote-block{font-style:italic;text-align:center;font-size:15px;margin:14px 20px;color:var(--ink-soft)}
  .quote-attr{font-size:12.5px;text-align:right;margin-right:40px;color:var(--ink-soft)}
  #help-body h3{margin:14px 0 4px;font-size:17px;font-weight:900}
  #help-body p,#help-body li{font-size:14px;line-height:1.5}
  #help-body ul{margin-left:20px;margin-bottom:8px}
  kbd{border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:12px;background:var(--card2);font-family:inherit}
  .close-x{float:right;cursor:pointer;font-size:20px;font-weight:900;width:36px;height:36px;border:none;border-radius:50%;background:var(--card2);color:var(--ink)}

  /* ---------- generals & options on the title sheet ---------- */
  .gen-in{font-family:inherit;font-size:14px;font-weight:800;color:var(--ink);text-align:center;
    width:100%;max-width:220px;padding:7px 8px;border:none;border-radius:10px;background:rgba(255,255,255,.92)}
  .gen-line{display:flex;gap:6px;align-items:center;justify-content:center;margin:8px 0 2px}
  .gen-lbl{font-size:11px;letter-spacing:1px;font-weight:800;color:var(--ink-soft)}
  .dice{border:none;background:rgba(255,255,255,.92);border-radius:10px;font-size:17px;width:36px;height:34px;cursor:pointer;flex:none}
  .opt-row{display:flex;flex-direction:column;gap:8px;align-items:center;margin:4px 0 6px;font-size:14px;font-weight:600}
  .opt-row label{cursor:pointer;display:flex;gap:8px;align-items:center}
  .opt-row input{width:20px;height:20px;accent-color:var(--green)}
  .guide li{margin-bottom:10px}
  details.more{margin:6px 0;text-align:center}
  details.more summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--ink-soft);list-style:none}
  details.more summary::-webkit-details-marker{display:none}

  /* ---------- gate buttons in the bottom bar ---------- */
  #gate-chips{display:flex;gap:6px}
  .gchip{min-width:52px;height:48px;border:none;border-radius:14px;background:#fff;
    font-weight:900;font-size:15px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;
    line-height:1.1;cursor:pointer;padding:0 4px;box-shadow:0 3px 0 #b9c4bc}
  .gchip small{font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
  .gchip.threat{background:#ffe3df;box-shadow:0 3px 0 var(--red)}
  .gchip.threat small,.gchip.plug small{color:var(--red)}
  .gchip.noise{background:#fff4d6;box-shadow:0 3px 0 #e0a100}
  .gchip.open{background:var(--gold);box-shadow:0 3px 0 #b77400}.gchip.open small{color:#1b1300}
  .gchip:active{transform:translateY(2px);box-shadow:0 1px 0 #b9c4bc}

  /* ---------- gate command panel ---------- */
  #gatepanel{position:absolute;left:50%;transform:translateX(-50%);z-index:26;width:min(440px,96vw);
    background:var(--card);border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.45);
    padding:14px 16px 16px;font-size:14px;max-height:70vh;overflow-y:auto}
  #gatepanel.hidden{display:none}
  .gp-head{display:flex;align-items:center;gap:10px}
  .gp-badge{width:44px;height:44px;border-radius:50%;background:#132219;color:#fff;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:16px;flex:none}
  .gp-title{font-size:20px;font-weight:900;white-space:nowrap}
  .gp-sub{font-size:12.5px;font-weight:600;color:var(--ink-soft);flex:1}
  .gp-x{border:none;background:var(--card2);width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:900;cursor:pointer;color:var(--ink);align-self:center;flex:none}
  .gp-paused{display:none!important}
  .gp-intel{margin:10px 0 6px;line-height:1.4;background:var(--card2);border-radius:14px;padding:10px 12px;font-size:14.5px;font-weight:600}
  .gp-intel b{font-weight:900}
  .gp-intel .warn{color:var(--red)}
  .gp-row{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
  .gp-lbl{font-weight:800}
  .stepper{display:inline-flex;align-items:center;border-radius:14px;overflow:hidden;background:var(--card2)}
  .stepper button{width:48px;height:48px;font-size:26px;font-weight:900;border:none;background:none;cursor:pointer;color:var(--ink)}
  .stepper button:active{background:var(--line)}
  .stepper span{min-width:44px;text-align:center;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
  .gp-hint{font-size:14px;font-weight:800;color:var(--ink-soft);flex:1 1 140px}
  .gp-hint.good{color:var(--green)}.gp-hint.bad{color:var(--red)}
  .gp-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .gp-btn{flex:1 1 0;min-height:52px;cursor:pointer;border:none;background:var(--card2);border-radius:14px;
    padding:8px 10px;font-size:15px;font-weight:800;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15}
  .gp-btn small{font-size:11.5px;font-weight:600;color:var(--ink-soft)}
  .gp-btn.primary{background:var(--green);color:#fff;font-size:17px;box-shadow:0 4px 0 #157040}
  .gp-btn.primary small{color:rgba(255,255,255,.85)}
  .gp-btn.primary.atk{background:var(--red);box-shadow:0 4px 0 #a92a1c}
  .gp-btn:disabled{opacity:.4;cursor:default}
  .gp-btn:active{transform:translateY(2px)}
  .gp-chk{display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
  .gp-chk input{width:20px;height:20px;accent-color:var(--green)}
  .gp-more{margin-top:10px}
  .gp-more summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--ink-soft);text-align:center;list-style:none;padding:4px}
  .gp-more summary::-webkit-details-marker{display:none}
  #log-last{display:none;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  #log.collapsed #log-last{display:block}
  #log.docked{width:auto;max-height:none}
  .lbl-short{display:none}

  /* ---------- phones & narrow windows ---------- */
  @media (max-width:760px){
    #topbar{height:auto;flex-wrap:wrap;font-size:13px}
    .tb-cell{padding:0 7px}
    .army-chip .aname{font-size:11px}
    .bigscore{font-size:22px;min-width:30px}
    #tb-mid{order:10;flex-basis:100%;padding:3px 8px 5px;flex-direction:row!important;gap:8px!important;background:rgba(255,255,255,.05)}
    #q-label{font-size:12px;white-space:nowrap}
    #phase-label{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #clock{font-size:19px}
    .tb-btns{margin-left:auto;gap:4px;padding:6px 6px}
    .tb-btn{padding:5px 8px;font-size:14px;min-width:36px;min-height:36px}
    .lbl-long{display:none}.lbl-short{display:inline}
    #botbar{padding:7px max(6px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));gap:6px;min-height:0}
    #sel-info{min-width:0;flex-basis:100%;font-size:13px}
    #sel-info #sel-sub{display:inline;margin-left:6px}
    #gate-chips{flex-basis:100%;justify-content:space-between}
    .gchip{flex:1;min-width:0}
    #act-buttons{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%}
    .act-btn{flex:1 1 auto;padding:9px 8px;font-size:13.5px}
    .act-btn.adv,.key-hint{display:none}
    #tipline{font-size:12.5px;padding-top:0}
    #log{width:auto;left:8px;right:8px;top:auto;font-size:12px}
    #banner .b-main{font-size:22px;padding:8px 20px}
    #banner .b-sub{font-size:13px}
    #banner{top:22%;width:94vw}
    .sheet{padding:20px 16px;width:96%}
    .sheet h1{font-size:30px}
    .sheet h2.script{font-size:21px}
    .sheet p{font-size:14px}
    .pick-row{gap:8px;margin:12px 0}
    .army-card{padding:12px 8px}
    .army-card h3{font-size:17px}
    .gen-in{font-size:13px}
    .go-btn{padding:14px 34px;font-size:18px}
  }
  @media (max-width:420px){
    .tb-cell{padding:0 5px}
    .army-chip{gap:4px}
    .army-chip .aname{display:none}
    .bigscore{font-size:20px;min-width:22px}
    #clock{font-size:17px;padding:3px 7px}
    .tb-btns{gap:3px;padding:4px 4px}
    .tb-btn{padding:3px 5px;min-width:32px;min-height:34px;font-size:13px}
    .dice{width:32px}
  }
  /* phones held sideways: one slim bar on top, one on the bottom */
  @media (max-height:500px){
    #topbar{height:42px;flex-wrap:nowrap;font-size:13px}
    .tb-cell{padding:0 7px}
    .bigscore{font-size:20px;min-width:24px}
    #tb-mid{order:0;flex-basis:auto;padding:0 6px;flex-direction:column!important;gap:0!important;min-width:0;background:none}
    #q-label{font-size:11px} #phase-label{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
    #clock{font-size:17px}
    .tb-btn{padding:3px 7px;min-height:30px;font-size:13px}
    .lbl-long{display:none}.lbl-short{display:inline}
    #botbar{padding:4px max(6px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));gap:6px;min-height:0;flex-wrap:nowrap}
    #sel-info,#tipline{display:none}
    #gate-chips{flex:1 1 auto}
    .gchip{flex:1;min-width:0;height:42px}
    #act-buttons{display:flex;gap:5px;flex:none}
    .act-btn{padding:7px 9px;font-size:13px}
    .act-btn.adv,.key-hint{display:none}
    #log{font-size:11.5px}
    #gatepanel{max-height:calc(100vh - 100px);padding:10px 14px}
    .gp-intel{font-size:13.5px;margin:6px 0 4px;padding:8px 10px}
    .gp-btn{min-height:46px}
    #banner{top:18%}
    #banner .b-main{font-size:20px;padding:6px 16px} #banner .b-sub{font-size:12px}
    .sheet{padding:14px 18px;max-height:96vh}
    .sheet h1{font-size:26px}
    .pick-row{margin:8px 0}
  }

  /* ======== mature theme: dark tactical UI, crisp type, flat controls ======== */
  :root{
    --bg:#0e1311; --card:#171e1b; --card2:#222b27; --ink:#e9eeeb; --ink-soft:#97a39c; --line:#2f3a35;
    --grey:#8a939c; --grey-dark:#5b646d; --blue:#3f74d6; --blue-dark:#2b57ad;
    --gold:#d4a24c; --red:#cf4b3c; --green:#3c8b5a; --r:10px;
    --font:-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  }
  body{color:var(--ink)}
  #topbar,#botbar{background:#121816;box-shadow:0 1px 0 #26302b,0 4px 14px rgba(0,0,0,.4)}
  #botbar{box-shadow:0 -1px 0 #26302b,0 -4px 14px rgba(0,0,0,.4)}
  .bigscore{font-weight:700}
  #clock{font-weight:700;background:none;border:1px solid #2f3a35;border-radius:6px}
  #q-label{font-weight:600;font-size:12px;letter-spacing:.8px;text-transform:uppercase}
  #phase-label{font-weight:600;color:var(--gold)}
  .tb-btn,.act-btn{background:#1f2724;border:1px solid #2f3a35;border-radius:6px;font-weight:600}
  .tb-btn.on,.act-btn.armed{background:var(--gold);color:#16120a;border-color:var(--gold)}
  #tipline{color:var(--ink-soft);font-weight:500}
  #sel-sub{color:var(--ink-soft);font-weight:500}
  .pennant{border-width:1.5px;border-radius:2px;width:12px;height:12px}
  #log{background:rgba(23,30,27,.95);border:1px solid var(--line);border-radius:8px;color:var(--ink)}
  #log h4{color:var(--ink-soft);font-weight:700}
  #log .ent{border-bottom-color:var(--line)}
  #log .grey{color:#c3c9cf} #log .blue{color:#8db0f0} #log .ump{color:#ef8a7c}
  #banner .b-main{background:rgba(14,19,17,.92);border:1px solid #3a4640;border-radius:6px;font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:26px}
  #banner .b-sub{background:none;color:#e9eeeb;font-weight:500;font-style:italic;text-shadow:0 1px 3px rgba(0,0,0,.9)}
  #overlay{background:rgba(6,9,8,.72)}
  .plaque{margin:12px auto;max-width:340px;padding:10px 14px 12px;border:3px solid #1f3a6e;border-radius:3px;text-align:left;
    background:linear-gradient(92deg,#c98f3d,#d9a24a 22%,#cf9742 47%,#dcaa55 71%,#c88c3a);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 0 22px rgba(120,70,10,.35);
    color:#15120c;font-family:"Marker Felt","Chalkboard SE","Bradley Hand","Segoe Print",system-ui,sans-serif;font-weight:700;font-size:19px;line-height:1.22;letter-spacing:.3px}
  .plaque .pl-head{font-family:Georgia,"Times New Roman",serif;font-weight:900;font-size:22px;letter-spacing:1px;color:#1f3a6e;text-align:center;margin-bottom:4px}
  .plaque .pl-row{white-space:nowrap}
  .plaque.small{font-size:15px;max-width:290px}
  #overlay.scene{background-color:#0b0f0d;background-size:cover;background-position:42% center;
    background-image:linear-gradient(rgba(8,11,10,.08),rgba(8,11,10,.50)),var(--pic)}
  @media (orientation:portrait) and (max-width:700px){
    #overlay.scene{align-items:flex-end;background-repeat:no-repeat;background-size:100% 100%,auto 44%;background-position:0 0,50% 0;
      background-image:linear-gradient(rgba(11,15,13,0) 30%,#0b0f0d 44%),var(--pic)}
    #overlay.scene .sheet{margin-bottom:max(10px,env(safe-area-inset-bottom));max-height:calc(100% - 96px)}
  }
  #overlay.scene .sheet{background:rgba(16,21,19,.78);border-color:rgba(255,255,255,.14);
    -webkit-backdrop-filter:blur(14px) saturate(1.1);backdrop-filter:blur(14px) saturate(1.1)}
  .sheet{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
  .sheet h1{font-weight:800;letter-spacing:4px;font-size:34px}
  .sheet h2.script{font-weight:600;font-size:15px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-soft)}
  .sheet .rule-line{border-top-color:var(--line)}
  .kicker{color:var(--gold);font-weight:700;letter-spacing:3px}
  .army-card{border-radius:8px;opacity:.45;border:1px solid transparent}
  #pick-G{background:linear-gradient(160deg,#59626b,#363c42)} #pick-B{background:linear-gradient(160deg,#3463bd,#1f3f7d)}
  .army-card.sel{border:1px solid var(--gold);box-shadow:0 0 0 2px var(--gold)}
  .army-card h3{font-weight:800;letter-spacing:3px}
  .gen-in{background:rgba(0,0,0,.28);color:#fff;border-radius:6px;font-weight:600}
  .dice{background:rgba(0,0,0,.28);color:#fff;border-radius:6px;font-size:16px;font-weight:700}
  .diff-row{background:var(--card2);border-radius:8px}
  .diff-btn{border-radius:6px;font-weight:600}
  .diff-btn.sel{background:#34403a;color:#fff;box-shadow:none}
  .go-btn{background:var(--gold);color:#16120a;border-radius:8px;font-weight:800;letter-spacing:3px;box-shadow:none;font-size:17px}
  .go-btn:active{transform:translateY(1px);box-shadow:none}
  .score-table{background:var(--card2);border-radius:8px}
  .score-table th,.score-table td{border-bottom-color:var(--line)}
  .opt-row input,.gp-chk input{accent-color:var(--gold)}
  a{color:inherit}
  kbd{background:var(--card2);border-color:var(--line)}
  .close-x{background:var(--card2);color:var(--ink);border-radius:6px}
  .gchip{background:#1f2724;color:var(--ink);border:1px solid #2f3a35;border-radius:8px;box-shadow:none;font-weight:700}
  .gchip small{color:var(--ink-soft);font-weight:600}
  .gchip.threat{background:#3a1f1b;border-color:var(--red);box-shadow:none}
  .gchip.threat small,.gchip.plug small{color:#ef8a7c}
  .gchip.noise{background:#2f2a1b;border-color:#8c7330;box-shadow:none}
  .gchip.open{background:var(--gold);border-color:var(--gold);color:#16120a;box-shadow:none}.gchip.open small{color:#16120a}
  .gchip:active{transform:translateY(1px);box-shadow:none}
  #gatepanel{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px}
  .gp-badge{background:none;border:1.5px solid var(--ink);border-radius:6px;width:42px;height:42px;font-weight:800;letter-spacing:.5px}
  .gp-title{font-weight:700;font-size:19px}
  .gp-sub{color:var(--ink-soft);font-weight:500}
  .gp-x{background:var(--card2);color:var(--ink);border-radius:6px;font-weight:600}
  .gp-intel{background:var(--card2);border-radius:8px;font-weight:500}
  .gp-intel b{font-weight:700}
  .gp-intel .warn{color:#ef8a7c}
  .stepper{background:var(--card2);border-radius:8px}
  .stepper button{color:var(--ink);font-weight:500}
  .stepper button:active{background:#34403a}
  .stepper span{font-weight:700}
  .gp-hint{font-weight:600}
  .gp-hint.good{color:#7cc597}.gp-hint.bad{color:#ef8a7c}
  .gp-btn{background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:8px;font-weight:700}
  .gp-btn small{color:var(--ink-soft);font-weight:500}
  .gp-btn.primary{background:var(--gold);color:#16120a;border-color:var(--gold);box-shadow:none}
  .gp-btn.primary small{color:rgba(22,18,10,.72)}
  .gp-btn.primary.atk{background:var(--red);border-color:var(--red);color:#fff;box-shadow:none}
  .gp-btn.primary.atk small{color:rgba(255,255,255,.8)}
  .gp-btn:active{transform:translateY(1px)}
  .gp-more summary,details.more summary{color:var(--ink-soft);font-weight:600}
  @media (pointer:coarse){ .act-btn.adv{display:none} .key-hint{display:none} .gp-classic{display:none!important} }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="topbar">
    <div class="tb-cell army-chip"><span class="pennant g"></span><span class="aname">GREY</span><span class="bigscore" id="score-g">0</span></div>
    <div class="tb-cell army-chip"><span class="bigscore" id="score-b">0</span><span class="aname">BLUE</span><span class="pennant b"></span></div>
    <div class="tb-cell tb-flex" id="tb-mid" style="flex-direction:column;justify-content:center;gap:0">
      <div id="q-label">Day 1 — 1st Quarter</div>
      <div id="phase-label">Declaration of War</div>
    </div>
    <div class="tb-cell"><span id="clock">4:00</span></div>
    <div class="tb-cell tb-btns">
      <button class="tb-btn" id="btn-speed" title="Game speed">1×</button>
      <button class="tb-btn" id="btn-pause" title="Pause (Space)">❙❙</button>
      <button class="tb-btn" id="btn-mute" title="Sound">♪</button>
      <button class="tb-btn" id="btn-help" title="Rules &amp; controls"><span class="lbl-long">Rules</span><span class="lbl-short">?</span></button>
    </div>
  </div>

  <div id="log"><h4 id="log-head" title="tap to open or close">PLAY-BY-PLAY ▾</h4><div id="log-last"></div><div id="log-entries"></div></div>

  <div id="gatepanel" class="hidden"></div>

  <div id="botbar">
    <div id="sel-info">No men selected<div id="sel-sub">Tap a gate to give orders.</div></div>
    <div id="gate-chips"></div>
    <span id="act-buttons"></span>
    <div id="tipline"></div>
  </div>

  <div id="banner"><div class="b-main" id="banner-main"></div><br><div class="b-sub" id="banner-sub"></div></div>

  <div id="overlay"><div class="sheet" id="overlay-sheet"></div></div>
</div>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const rndi = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = arr=>arr[Math.floor(Math.random()*arr.length)];
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);
const dist = (a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lerp = (a,b,t)=>a+(b-a)*t;
function ptOnSeg(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy;if(!L2)return{x:a.x,y:a.y};
  const t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/L2,0,1);return{x:a.x+dx*t,y:a.y+dy*t}}
function distToPoly(p,pts){let m=1e9;for(let i=0;i<pts.length-1;i++){const q=ptOnSeg(p,pts[i],pts[i+1]);m=Math.min(m,dist(p,q))}return m}

  if(((yi>p.y)!==(yj>p.y))&&(p.x<(xj-xi)*(p.y-yi)/(yj-yi)+xi))inside=!inside}return inside}
function segsIntersect(a,b,c,d){function ccw(p,q,r){return(r.y-p.y)*(q.x-p.x)>(q.y-p.y)*(r.x-p.x)}
  return ccw(a,c,d)!==ccw(b,c,d)&&ccw(a,b,c)!==ccw(a,b,d)}

function polyLen(pl){let L=0;for(let i=1;i<pl.length;i++)L+=dist(pl[i-1],pl[i]);return L}
function roadPt(g,t){ // the point t along a gate's road, and the road's heading there (runs straight on past either end)
  const r=g.road;let acc=0;
  for(let i=1;i<r.length;i++){const a=r[i-1],b=r[i],L=dist(a,b)||1;
    if(t<=acc+L||i===r.length-1){const u=(t-acc)/L,dx=(b.x-a.x)/L,dy=(b.y-a.y)/L;return{x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u,dx,dy}}
    acc+=L}
}
function roadOff(g,t,off){const p=roadPt(g,t);return{x:p.x-p.dy*(off||0),y:p.y+p.dx*(off||0)}}
function roadProj(p,g){ // how far along the road the nearest point is (t), and how far off to the side (s)
  const r=g.road;let acc=0,bt=0,bs=1e9;
  for(let i=1;i<r.length;i++){const a=r[i-1],b=r[i],L=dist(a,b)||1,q=ptOnSeg(p,a,b),d=dist(p,q);
    if(d<bs){bs=d;bt=acc+dist(a,q)}acc+=L}
  return{t:bt,s:bs};
}
GATES.forEach((g,i)=>{
  g.idx=i;g.pos={x:g.x,y:g.y};g.hasBlue=g.toBlue.length>0;
  const pts=[g.pos].concat(g.toRed,g.toBlue),n=pts.length,a=pts[n-2],b=pts[n-1],L=dist(a,b)||1;
  g.rEnd=polyLen([g.pos].concat(g.toRed));                    // red flags
  g.bEnd=g.hasBlue?polyLen(pts):g.rEnd;                        // blue flags
  g.tail=g.hasBlue?45:90;                                      // the road runs on a little past the last flags
  g.road=pts.concat([{x:b.x+(b.x-a.x)/L*g.tail,y:b.y+(b.y-a.y)/L*g.tail}]);
  g.len=polyLen(g.road);
  const h=roadPt(g,40),hl=Math.hypot(h.x-g.x,h.y-g.y)||1;
  g.dx=(h.x-g.x)/hl;g.dy=(h.y-g.y)/hl;                         // which way the gate faces
  g.perp={x:-g.dy,y:g.dx};
  g.gateIn={x:g.x-g.dx*26,y:g.y-g.dy*26};                     // just inside town
  g.rfaT=g.rEnd*0.55;g.bfaT=g.hasBlue?(g.rEnd+g.bEnd)/2:g.rEnd+45;
  g.rfaPt=roadOff(g,g.rfaT);                                   // middle of red flag area
  g.redFlag=roadOff(g,g.rEnd);
  g.bfaPt=roadOff(g,g.bfaT);                                   // middle of blue flag area (or just past the red flags)
  g.blueFlag=roadOff(g,g.bEnd);

/* ---------------- waypoint graph for pathfinding ---------------- */
const NAV=(function(){
  const nodes=[],edges=[];
  function add(x,y,tag){nodes.push({x,y,tag,adj:[]});return nodes.length-1}
  // interior nodes: just inside each gate, joined by the paths inside the town line
  const innerIdx={};
  GATES.forEach(g=>{innerIdx[g.id]=add(g.gateIn.x,g.gateIn.y,"in-"+g.id)});
  const pathNode={},pathEdges=[];
  const pnode=p=>{for(const g of GATES)if(dist(p,g.pos)<3)return innerIdx[g.id];
    const k=p.x+","+p.y;if(!(k in pathNode))pathNode[k]=add(p.x,p.y,"ring");return pathNode[k]};
  for(const pl of PATHS)for(let i=1;i<pl.length;i++)pathEdges.push([pnode(pl[i-1]),pnode(pl[i])]);
  // outside nodes per gate, strung along the road: red flag area, blue flag area, road end
  const outIdx={};
  GATES.forEach(g=>{
    const stops=[[g.rfaT,"rfa-"+g.id],[g.bfaT,"bfa-"+g.id],[g.len,"end-"+g.id]];
    let acc=0;for(let i=1;i<g.road.length-1;i++){acc+=dist(g.road[i-1],g.road[i]);
      if(stops.every(st=>Math.abs(st[0]-acc)>18))stops.push([acc,"rd"])}
    stops.sort((p,q)=>p[0]-q[0]);
    const chain=stops.map(st=>{const p=roadOff(g,st[0]);return add(p.x,p.y,st[1])});
    const find=tag=>chain[stops.findIndex(st=>st[1]===tag)];
    outIdx[g.id]={rfa:find("rfa-"+g.id),bfa:find("bfa-"+g.id),end:find("end-"+g.id),chain};
  });
  // woods lattice outside town
  const lattice=[];
  for(let x=80;x<CFG.worldW;x+=155){
    for(let y=80;y<CFG.worldH;y+=150){
      const p={x:x+((x*7+y*13)%53)-26,y:y+((x*11+y*5)%47)-23};
      if(pointInPoly(p,TOWN_POLY))continue;
      if(distToPoly(p,TOWN_POLY.concat([TOWN_POLY[0]]))<42)continue;
      lattice.push(add(p.x,p.y,"w"));
    }
  }
  add(CAMPSITE.x,CAMPSITE.y,"campsite");lattice.push(nodes.length-1);
  add(RALLY2.x,RALLY2.y,"rally2");lattice.push(nodes.length-1);
  function connect(i,j){
    if(i===j)return;
    const a=nodes[i],b=nodes[j];
    nodes[i].adj.push(j);nodes[j].adj.push(i);
  }
  // interior connections: along the paths
  for(const[i,j]of pathEdges)connect(i,j);
  // road chains: gate-in <-> each stop out along the road
  GATES.forEach(g=>{
    const ch=outIdx[g.id].chain;
    connect(innerIdx[g.id],ch[0]);for(let i=1;i<ch.length;i++)connect(ch[i-1],ch[i]);
  });
  // lattice: connect neighbours when the segment stays outside town
  for(let i=0;i<lattice.length;i++)for(let j=i+1;j<lattice.length;j++){
    const a=nodes[lattice[i]],b=nodes[lattice[j]];
    const d=dist(a,b);
    if(d<235&&!segCrossesPoly(a,b,TOWN_POLY))connect(lattice[i],lattice[j]);
  }
  // road ends join the woods
  GATES.forEach(g=>{
    const e=outIdx[g.id].end,en=nodes[e];
    let best=[],ds=[];
    for(const li of lattice){const d=dist(en,nodes[li]);
      if(d<300&&!segCrossesPoly(en,nodes[li],TOWN_POLY)){best.push(li);ds.push(d)}}
    best.map((li,k)=>[ds[k],li]).sort((a,b)=>a[0]-b[0]).slice(0,4).forEach(([,li])=>connect(e,li));
  });
  function nearestNode(p,filter){
    let bi=-1,bd=1e9;
    for(let i=0;i<nodes.length;i++){
      if(filter&&!filter(nodes[i],i))continue;
      const d=dist(p,nodes[i]);if(d<bd){bd=d;bi=i}
    }return bi;
  }
  const routeCache=new Map();
  function route(from,to,side){ // side: 'A' attackers avoid town interior; 'D' defenders avoid Center
    const okNode=n=>{
      if(side==="A"&&(n.tag.startsWith("in-")||n.tag==="ring"))return false;
      return true;
    };
    const s=nearestNode(from,(n)=>okNode(n)), t=nearestNode(to,(n)=>okNode(n));
    if(s<0||t<0)return [to];
    const ck=s+":"+t+":"+side;
    if(routeCache.has(ck)){
      const path=routeCache.get(ck).slice();
      path.push({x:to.x,y:to.y});
      if(path.length>1&&dist(from,path[1])<dist(from,path[0]))path.shift();
      return path;
    }
    // Dijkstra
    const N=nodes.length,distA=new Float64Array(N).fill(1e15),prev=new Int32Array(N).fill(-1),done=new Uint8Array(N);
    distA[s]=0;
    for(;;){
      let u=-1,ud=1e15;
      for(let i=0;i<N;i++)if(!done[i]&&distA[i]<ud){ud=distA[i];u=i}
      if(u<0||u===t)break;
      done[u]=1;
      for(const v of nodes[u].adj){
        if(done[v]||!okNode(nodes[v]))continue;
        const w=dist(nodes[u],nodes[v]);
        if(distA[u]+w<distA[v]){distA[v]=distA[u]+w;prev[v]=u}
      }
    }
    if(distA[t]>=1e15)return [to];
    const base=[];let c=t;
    while(c!==-1){base.push({x:nodes[c].x,y:nodes[c].y});c=prev[c]}
    base.reverse();
    if(routeCache.size>400)routeCache.clear();
    routeCache.set(ck,base);
    const path=base.slice();path.push({x:to.x,y:to.y});
    // trim silly first hop
    if(path.length>1&&dist(from,path[1])<dist(from,path[0]))path.shift();
    return path;
  }
  return {nodes,route,nearestNode};
})();

const SND=(function(){

    const buf=c.createBuffer(1,c.sampleRate*1.4,c.sampleRate),d=buf.getChannelData(0);

    if(sirenNodes){try{sirenNodes.o.stop()}catch(e){};sirenNodes=null}
    if(on&&!muted){const o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();

      l.connect(lg);lg.connect(o.frequency);o.connect(g);g.connect(c.destination);

    setMuted(m){muted=m;if(m)siren(false)},get muted(){return muted},poke(){ac()}};
})();

let G=null; // the whole game state

      noise:0,fxT:0})),

    flavorT:18+rnd()*14, endEarlyT:0,

  };
  // build the men

  for(const a of ["G","B"]){
    for(let i=0;i<CFG.armySize;i++){
      G.men.push({
        id:id++,army:a,x:0,y:0,path:null,pathI:0,speedJit:0.92+rnd()*0.16,
        state:"idle", // idle|move|gate|tempdead|centerdead|frozen
        partyId:0,caller:false,plugKneel:false,
        scoreGame:0,scoreFirst:0,deadUntilPt:null,deadTimer:0,
        stamina:CFG.sprintTime,sprint:false,gateIdx:-1,homeGate:-1,
        fx:0,fy:0, // formation offset
      });
    }
  }
  G.menG=G.men.filter(m=>m.army==="G");
  G.menB=G.men.filter(m=>m.army==="B");
  placeArmiesForQuarter();
  return G;
}

function armyMen(a){return a==="G"?G.menG:G.menB}
function attackerMen(){return armyMen(G.attacker)}
function defenderMen(){return armyMen(other(G.attacker))}
function isFirstAttackPeriod(army){ // that army's first attacking quarter = quarter 1 or 2 of day 1
  return G.day===1&&G.attacker===army&&(G.quarter===1||G.quarter===2);
}
function eligibleToScore(m){
  if(m.scoreGame>=CFG.maxScoreGame)return false;
  if(isFirstAttackPeriod(m.army)&&m.scoreFirst>=CFG.maxScoreFirstPeriod)return false;
  return true;
}

function placeArmiesForQuarter(){
  const atk=G.attacker,def=other(atk);
  // attackers muster at the campsite corner; defenders at the Center of Town edge
  const rally=(atk==="G")?CAMPSITE:{x:RALLY2.x,y:RALLY2.y};
  G.rally=rally;
  armyMen(atk).forEach((m,i)=>{
    m.x=rally.x+(i%8)*13-52+rnd()*6;m.y=rally.y+Math.floor(i/8)*13-26+rnd()*6;
    m.state="idle";m.path=null;m.partyId=0;m.caller=false;m.gateIdx=-1;m.homeGate=-1;
    m.plugKneel=false;m.deadUntilPt=null;m.stamina=CFG.sprintTime;m.scout=false;
  });
  // defenders: pre-assigned garrisons of 6-7 (they deploy at "scouts out")
  const dm=armyMen(def);
  dm.forEach((m,i)=>{
    const gi=i%6;
    m.homeGate=gi;m.gateIdx=-1;m.partyId=0;m.caller=false;m.plugKneel=false;
    m.state="idle";m.path=null;m.deadUntilPt=null;m.stamina=CFG.sprintTime;m.scout=false;
    m.x=CENTER.x+Math.cos(i*0.7)*(CENTER.r+30+(i%3)*14);
    m.y=CENTER.y+Math.sin(i*0.7)*(CENTER.r+30+(i%3)*14);
  });
  G.gates.forEach(gs=>{gs.cooldown=0;gs.plugged=false;gs.noise=0;gs.seenCount=0;gs.lastSeenByAtk=-999;gs.atkAbortT=null;gs.clashT=0;
    gs.atkSeenDef=null;gs.atkSeenPlug=false;gs.lastSeen=-999});
  if(G.pTarget){G.pTarget=GATES.map(()=>null);G.pTouch=GATES.map(()=>-999)}
  G.hold=false;
  G.ghosts=[];G.parties=[];G.selection=[];G.armedOrder=null;
  G.clock=CFG.quarterLen;G.tPlay=0;G.playLive=false;G.scoutsOut=false;G.freeze=null;
  G.aiD={think:0,plan:null,lastRedeploy:0};
  G.aiA={think:1.5,stage:"gather",stageT:0,targets:[],callers:[]};
  G.endEarlyT=0;
}

/* ---------------- logging & banners ---------------- */
function log(kind,msg){
  G.log.push({t:CFG.quarterLen-G.clock,kind,msg,q:G.quarter});
  if(G.log.length>200)G.log.shift();
  ui.logDirty=true;
}
function banner(main,sub,dur){

/* ---------------- parties ---------------- */
function makeParty(men,role){
  if(!men.length)return null;
  const p={id:G.nextPartyId++,army:men[0].army,men:[...men],role:role||"move",
    state:"idle",targetGate:-1,formT:0,anchor:null,chargeStep:0};
  for(const m of men){leaveParty(m);m.partyId=p.id}
  assignFormation(p);
  G.parties.push(p);
  return p;
}
function getParty(id){return G.parties.find(p=>p.id===id)}
function leaveParty(m){
  if(!m.partyId)return;
  const p=getParty(m.partyId);
  if(p){p.men=p.men.filter(x=>x!==m);if(!p.men.length)G.parties=G.parties.filter(x=>x!==p)}
  m.partyId=0;
}
function assignFormation(p){
  const n=p.men.length,cols=Math.ceil(Math.sqrt(n));
  p.men.forEach((m,i)=>{m.fx=((i%cols)-(cols-1)/2)*13;m.fy=(Math.floor(i/cols)-(Math.ceil(n/cols)-1)/2)*12});
}
function partyCenter(p){let x=0,y=0;for(const m of p.men){x+=m.x;y+=m.y}return{x:x/p.men.length,y:y/p.men.length}}

/* ---------------- orders ---------------- */
function orderMove(men,target,opts){
  opts=opts||{};
  if(!men.length)return;
  const p=makeParty(men,opts.role||"move");
  const side=(men[0].army===G.attacker)?"A":"D";
  const c=partyCenter(p);
  const path=NAV.route(c,target,side);
  p.state="moving";p.anchor=target;
  for(const m of p.men){
    if(m.state==="tempdead"||m.state==="centerdead")continue;
    m.path=path.map(q=>({x:q.x,y:q.y}));m.pathI=0;m.state="move";
    m.sprint=!!opts.sprint;m.gateIdx=-1;m.plugKneel=false;m.caller=false;m.scout=!!opts.scout;
  }
  if(opts.role==="callers")for(const m of p.men)m.caller=true;
  return p;
}
function orderGarrison(men,gateIdx,opts){ // defenders man a gate
  const g=GATES[gateIdx];
  const p=orderMove(men,g.gateIn,opts);
  if(!p)return;
  p.role="garrison";p.targetGate=gateIdx;
  for(const m of p.men)m.homeGate=gateIdx;
  return p;
}
function orderCharge(men,gateIdx){ // attackers make a scoring attempt
  const g=GATES[gateIdx];
  const stage=gateStage(g);
  const p=orderMove(men,{x:stage.x,y:stage.y},{role:"charge"});
  if(!p)return;
  p.role="charge";p.targetGate=gateIdx;p.state="approach";
  return p;
}
function orderCallers(men,gateIdx){
  const g=GATES[gateIdx];
  const spot=roadOff(g,g.hasBlue?g.bEnd+20:g.rEnd+70,46);
  const p=orderMove(men,spot,{role:"callers"});
  if(p){p.role="callers";p.targetGate=gateIdx}
  return p;
}

/* ---------------- movement ---------------- */
function moveMan(m,dt){
  if(!m.path||m.pathI>=m.path.length){m.state=m.state==="move"?"idle":m.state;m.path=null;return}
  const tgt=m.path[m.pathI],goal={x:tgt.x+m.fx,y:tgt.y+m.fy};
  const last=m.pathI===m.path.length-1;
  const aim=last?goal:tgt;
  const d=dist(m,aim);
  if(d<(last?4:16)){m.pathI++;if(m.pathI>=m.path.length){m.path=null;if(m.state==="move")m.state="idle";arriveMan(m)}return}
  m._tc=(m._tc||0)-dt;
  if(m._tc<=0||m._terr==null){m._terr=terrainMult(m);m._tc=0.35}
  let sp=CFG.baseSpeed*m.speedJit*m._terr;
  if(m.sprint&&m.stamina>0){sp*=CFG.sprintMult;m.stamina-=dt}
  else m.stamina=Math.min(CFG.sprintTime,m.stamina+dt*(CFG.sprintTime/CFG.sprintRegen));
  if(m.state==="tempdead")sp*=0.85;
  m.x+=(aim.x-m.x)/d*sp*dt;m.y+=(aim.y-m.y)/d*sp*dt;
}
function arriveMan(m){
  if(m.state==="tempdead"){ // reached the blue flags — alive again shortly
    m.deadTimer=2.5;return;
  }
  const p=getParty(m.partyId);
  if(p&&p.role==="garrison"&&p.targetGate>=0){m.gateIdx=p.targetGate}
}

/* ---------------- sighting & fog ---------------- */
function updateSighting(dt){
  const atk=G.attacker,def=other(atk);
  const now=CFG.quarterLen-G.clock;
  // group attackers by party for ghost markers
  const seenParties=new Map();
  // precompute each attacker's detectability radius once (terrain-dependent)
  const atkPre=[];
  for(const am of armyMen(atk)){
    if(am.state==="centerdead"||am.state==="tempdead")continue;
    let r=CFG.sightBase;
    if(inForest(am))r*=CFG.sightForestTargetMult;
    if(onRoad(am))r*=1.35;
    atkPre.push([am,r]);
  }
  // each attacker is counted once, however many defenders can see him
  const defsAlive=armyMen(def).filter(dm=>dm.state!=="centerdead");
  for(const[am,r]of atkPre){
    if(!defsAlive.some(dm=>dist(dm,am)<r))continue;
    const key=am.partyId||("solo"+am.id);
    if(!seenParties.has(key))seenParties.set(key,{n:0,x:0,y:0});
    const s=seenParties.get(key);s.n++;s.x+=am.x;s.y+=am.y;
  }
  // defenders sight attacker parties -> ghosts (for whichever side is viewing)
  for(const[key,s]of seenParties){
    const gx=s.x/s.n,gy=s.y/s.n;
    let gh=G.ghosts.find(h=>h.key===key&&h.side===def);
    if(!gh){gh={key,side:def,x:gx,y:gy,n:s.n,t:now};G.ghosts.push(gh);
      // "Party sighted!" callout for nearby gate
      let ng=-1,nd=1e9;GATES.forEach((g,i)=>{const d=dist({x:gx,y:gy},g.pos);if(d<nd){nd=d;ng=i}});
      if(nd<330){
        G.gates[ng].seenCount=s.n;G.gates[ng].lastSeen=now;
        if((def===G.playerArmy)&&!G.autotest)log(def==="G"?"grey":"blue",
          `Scout at ${GATES[ng].id} Gate: “Party sighted — ${s.n} ${s.n===1?"man":"men"}!”`);
      }
    }else{gh.x=gx;gh.y=gy;gh.n=s.n;gh.t=now}
  }
  // attackers sight gate garrisons
  for(const g of GATES){
    const near=armyMen(atk).some(m=>m.state!=="centerdead"&&dist(m,g.pos)<CFG.attackerSight+40);
    if(near){
      const gs=G.gates[g.idx];
      gs.lastSeenByAtk=now;
      gs.atkSeenDef=menInGateArea(g.idx).length;
      gs.atkSeenPlug=gs.plugged;
    }
  }
  G.ghosts=G.ghosts.filter(h=>now-h.t<CFG.ghostFade);
}
function menInGateArea(gi){ // defenders in/at the gate (the gate holds up to plugStrength)
  const g=GATES[gi],def=other(G.attacker);
  return armyMen(def).filter(m=>m.state!=="centerdead"&&m.state!=="tempdead"&&dist(m,g.pos)<46);
}
function defendersInGate(gi){
  const list=menInGateArea(gi);
  return Math.min(list.length,CFG.plugStrength+4); // extras crowd behind
}

/* ---------------- the whistle: play resolution ---------------- */
/* Implements Rules 17-27 & 31 of the 2018 Revision (auto-umpired). */
function resolvePlay(gi,chargeParty,trigger){
  const g=GATES[gi],gs=G.gates[gi];
  if(gs.cooldown>0)return;
  const atk=G.attacker,def=other(atk);
  const A=chargeParty?chargeParty.men.filter(m=>m.state!=="tempdead"&&m.state!=="centerdead"):[];
  const defList=menInGateArea(gi);
  const D=Math.min(defList.length,CFG.plugStrength); // a plugged gate is "deemed to contain" plug strength
  const plugged=defList.length>=CFG.plugStrength;
  gs.cooldown=CFG.gateCooldown;
  G.stats.plays++;
  G.freeze={gate:gi,t:CFG.whistleFreeze};
  SND.whistle(true);
  let ruling="",pts=0,ptsArmy=null,kind="";

  if(trigger==="enter"){ // attackers stepped into the gate
    const entrants=A.filter(eligibleToScore);
    const nIn=A.length;
    if(plugged){
      kind="repulse";
      ruling=`${nIn} ${ARMIES[atk].adj} attackers step against a PLUGGED gate — repulsed!`;
      repulseParty(chargeParty,g);
      G.stats.repulses++;
    }else if(nIn>D){
      // Rule 17: all attackers who properly entered may score (eligible men)
      kind="score";pts=entrants.length;ptsArmy=atk;
      for(const m of entrants)creditScore(m,g);
      const inel=nIn-entrants.length;
      ruling=`${pts} scoring point${pts===1?"":"s"}, ${ARMIES[atk].name}!`+
        (D>0?` (${nIn} attackers vs ${D} defenders in the gate)`:" — defenders never entered the gate")+
        (inel>0?` — ${inel} huddled, already at their limit`:"");
      clearChargedParty(chargeParty,g,false);
      SND.cheer();
    }else if(nIn===D){
      kind="repulse";
      ruling=`Equal numbers in the gate at ${g.id} — REPULSE! The ${ARMIES[atk].adj} party is dead until past the red flags.`;
      repulseParty(chargeParty,g);
      G.stats.repulses++;
    }else{
      kind="challenge";pts=D-nIn;ptsArmy=def;
      ruling=`Challenge, ${ARMIES[def].name}: ${D} defenders against ${nIn} attackers — ${pts} point${pts===1?"":"s"}.`;
      clearChargedParty(chargeParty,g,true);
      G.stats.challenges++;
    }
  }else if(trigger==="rfa"){ // defenders call the play with attackers in the red flag area
    const nIn=A.length;
    if(plugged||D===nIn){
      kind="repulse";
      ruling=plugged?
        `The ${g.id} Gate is plugged — the ${ARMIES[atk].adj} party of ${nIn} is repulsed!`:
        `${D} in the gate, ${nIn} on the road — a repulse at ${g.id}!`;
      repulseParty(chargeParty,g);
      G.stats.repulses++;
    }else if(D>nIn){
      kind="challenge";pts=D-nIn;ptsArmy=def;
      ruling=`Challenge, ${ARMIES[def].name}: caught ${nIn} in the red flag area against ${D} — ${pts} point${pts===1?"":"s"}.`;
      clearChargedParty(chargeParty,g,true);
      G.stats.challenges++;
    }else{ // defenders miscounted; no play
      kind="noplay";ruling=`No play at ${g.id} Gate.`;
    }
  }else if(trigger==="bfa"){ // ambush challenge in the blue flag area (3x points)
    const defParty=trigger&&G.bfaClash?G.bfaClash:null;
    // computed by caller: {defN, atkN}
    const {defN,atkN}=G.bfaClash;
    if(defN>atkN){kind="challenge";pts=(defN-atkN)*3;ptsArmy=def;
      ruling=`Challenge in the BLUE FLAG AREA at ${g.id} — three times the difference: ${pts} points, ${ARMIES[def].name}!`;
      clearChargedParty(chargeParty,g,true);
    }else if(atkN>defN){kind="challenge";pts=(atkN-defN)*3;ptsArmy=atk;
      ruling=`Challenge in the BLUE FLAG AREA at ${g.id} — squadron caught on the road: ${pts} points, ${ARMIES[atk].name}!`;
    }else{kind="noplay";ruling=`No play at ${g.id} Gate.`}
    G.bfaClash=null;
    G.stats.challenges++;
  }

  if(pts&&ptsArmy){G.score[ptsArmy]+=pts}
  if(!G.autotest){
    const good=kind==="noplay"?null:(kind==="repulse"?atk!==G.playerArmy:ptsArmy===G.playerArmy);
    haptic(good==null?"whistle":(good?"score":"against"));
  }
  log("ump",`⟟ Play off at ${g.id} Gate — ${ruling}`);
  banner(kind==="score"?`${pts} POINT${pts===1?"":"S"} — ${ARMIES[ptsArmy].name}!`:
         kind==="repulse"?`REPULSE AT ${g.id} GATE`:
         kind==="challenge"?`CHALLENGE — ${pts} PTS ${ARMIES[ptsArmy].name}`:
         "NO PLAY",
         `Umpire: “${ruling}”`,2.9);
  gs.fxT=1.2;
  ui.hudDirty=true;
}
function creditScore(m,g){
  m.scoreGame++;if(isFirstAttackPeriod(m.army))m.scoreFirst++;
  G.stats.scoresByMan[m.id]=(G.stats.scoresByMan[m.id]||0)+1;
  // Rule 31 d/e: where does the scorer go?
  const toCenter=(G.day===1&&m.scoreGame>=2)||(G.day===2&&m.scoreGame>=3);
  leaveParty(m);
  if(toCenter){
    m.state="centerdead";
    m.path=[{x:CENTER.x+rnd()*40-20,y:CENTER.y+rnd()*30-15}];m.pathI=0;
    // dead for the rest of the attack period; walks with hands on head
  }else{
    m.state="tempdead";
    m.path=[roadOff(g,(g.hasBlue?g.bEnd:g.len)+20,rnd()*50-25)];m.pathI=0;
    m.deadTimer=0;
  }
}
function repulseParty(p,g){
  if(!p)return;
  for(const m of p.men){
    if(m.state==="centerdead")continue;
    m.state="tempdead";
    const back=roadOff(g,g.rEnd+45,rnd()*70-35);
    m.path=[back];m.pathI=0;m.deadTimer=0;
  }
  p.state="done";p.role="move";p.targetGate=-1;
}
function clearChargedParty(p,g,challenged){
  if(!p)return;
  for(const m of p.men){
    if(m.state==="tempdead"||m.state==="centerdead")continue;
    const back=roadOff(g,g.len+30,rnd()*80-40);
    m.path=[back];m.pathI=0;m.state="move";
  }
  p.state="done";p.role="move";p.targetGate=-1;
}

/* ---------------- charge state machine ---------------- */
function updateCharges(dt){
  const now=CFG.quarterLen-G.clock;
  for(const p of G.parties.slice()){
    if(p.role!=="charge"||p.targetGate<0)continue;
    const g=GATES[p.targetGate],gs=G.gates[p.targetGate];
    const alive=p.men.filter(m=>m.state!=="tempdead"&&m.state!=="centerdead");
    if(!alive.length){p.role="move";continue}
    const c=partyCenter(p);
    if(p.state==="approach"){
      // arrived at staging (bfa or woods edge)?
      const stage=gateStage(g);
      if(dist(c,stage)<38&&alive.every(m=>!m.path||m.pathI>=m.path.length-1)){
        p.state="form";p.formT=CFG.chargeFormTime;
        if(p.army===G.playerArmy&&!G.autotest)log(p.army==="G"?"grey":"blue",
          `Party of ${alive.length} forms at the ${g.id} road: “Ready, ready — one, two, STEP!”`);
      }
    }else if(p.state==="form"){
      p.formT-=dt;
      if(p.formT<=0){
        if(gs.cooldown>0){p.state="wait"}
        else{
          p.state="step";p.rfaEnter=-1;
          for(const m of alive){m.path=[{x:g.rfaPt.x,y:g.rfaPt.y},{x:g.pos.x,y:g.pos.y}];m.pathI=0;m.state="move";m.sprint=false}
        }
      }
    }else if(p.state==="wait"){
      if(gs.cooldown<=0){p.state="form";p.formT=0.6}
    }else if(p.state==="step"){
      const inR=alive.filter(m=>inRFA(m,g)).length;
      const inG=alive.filter(m=>inGate(m,g)).length;
      if(inR>0&&p.rfaEnter<0)p.rfaEnter=now;
      // defenders may call the play once the party has dwelt in the RFA
      if(p.rfaEnter>0&&now-p.rfaEnter>CFG.rfaDwellForCall&&inG===0){
        const D=defendersInGate(p.targetGate);
        const plugged=menInGateArea(p.targetGate).length>=CFG.plugStrength;
        if(plugged||D>=alive.length){resolvePlay(p.targetGate,p,"rfa");continue}
      }
      if(inG>=alive.length*0.85&&inG>0){ // the party has stepped in together
        resolvePlay(p.targetGate,p,"enter");
      }
    }
  }
}

/* ---------------- quarter & match flow ---------------- */
function startQuarter(){
  G.phase="play";
  placeArmiesForQuarter();
  const atk=ARMIES[G.attacker],def=ARMIES[other(G.attacker)];
  log("ump",`— Day ${G.day}, ${["1st","2nd","3rd","4th"][G.quarter-1]} Quarter. ${atk.name} attacks; ${def.name} defends York's Crossing. —`);
  log("ump",`The Director sets active players at ${CFG.armySize} and plugged-gate strength at ${CFG.plugStrength}.`);
  const playerAtk=G.playerArmy===G.attacker;
  G.selection=[];
  banner(`${atk.name} ATTACKS`,playerAtk?
    `Your army musters at the ${G.attacker==="G"?"southwest":"southeast"} corner. ${ui.coarse?"Tap":"Click"} a gate to send men.`:
    `You hold the six gates of York's Crossing. ${ui.coarse?"Tap":"Click"} a gate to shift men.`,3.6);
  if(G.playerArmy===G.attacker)log(G.playerArmy==="G"?"grey":"blue",`${atk.general}: “${atk.cry}”`);
  else log(sideKind(G.playerArmy),`${ARMIES[G.playerArmy].general} holds the town.`);
  ui.hudDirty=true;ui.rebuildButtons();
  setTip(playerAtk?"You're attacking: scout a gate, then attack with more men than its guards.":
    "You're defending: your guards head to the gates. A red gate button means attackers were spotted there.");
}
function updatePhase(dt){
  const t=G.tPlay;
  if(!G.scoutsOut&&t>=CFG.scoutsOutAt){
    G.scoutsOut=true;SND.whistle(false);haptic("whistle");
    banner("SCOUTS OUT","Defenders man the gates",2.2);
    log("ump","Whistle: “Scouts out!” The defense takes the field.");
    deployPlayerGarrisons();
  }
  if(!G.playLive&&t>=CFG.playOnAt){
    G.playLive=true;SND.whistle(true);haptic("whistle");
    banner("PLAY IS ON","Scoring is live at every gate",2.4);
    log("ump","Whistle: play is on at all six gates.");
  }
}
function endQuarter(){
  const qrec={day:G.day,q:G.quarter,attacker:G.attacker,
    G:G.score.G-(G.qScores.reduce((s,r)=>s+r.G,0)),
    B:G.score.B-(G.qScores.reduce((s,r)=>s+r.B,0))};
  G.qScores.push(qrec);
  ui.closeGate();G.selection=[];G.armedOrder=null;
  SND.whistle(true);SND.siren(false);
  log("ump",`Final whistle of the quarter. Score so far — GREY ${G.score.G}, BLUE ${G.score.B}.`);
  if(G.quarter>=4){G.phase="final";G.over=true;ui.showFinal()}
  else{
    G.quarter++;
    if(G.quarter===3)G.day=2;
    // alternate: the first attacker attacks in Q1 & Q3? No — sides swap each quarter,
    // and on day 2 the order flips so each army attacks twice, defends twice.
    const seq={1:G.firstAttackerOfMatch,2:other(G.firstAttackerOfMatch),
               3:other(G.firstAttackerOfMatch),4:G.firstAttackerOfMatch};
    G.attacker=seq[G.quarter];
    G.phase="interquarter";ui.showInterquarter();
  }
}
function maybeEndEarly(dt){
  // if the attack cannot possibly score again, wind the quarter down
  const alive=attackerMen().filter(m=>m.state!=="centerdead");
  const anyEligible=alive.some(eligibleToScore);
  if(!anyEligible){
    G.endEarlyT+=dt;
    if(G.endEarlyT>4){
      log("ump","The attack is spent — every man has scored his limit. The umpires call the quarter.");
      G.clock=Math.min(G.clock,2);G.endEarlyT=-999;
    }
  }
}

/* ---------------- gate upkeep & road clashes ---------------- */
function updateGates(dt){
  const now=CFG.quarterLen-G.clock;
  G.gates.forEach((gs,i)=>{
    gs.cooldown=Math.max(0,gs.cooldown-dt);
    gs.fxT=Math.max(0,gs.fxT-dt);
    const inArea=menInGateArea(i);
    gs.def=inArea.length;
    const plug=inArea.length>=CFG.plugStrength;
    if(plug!==gs.plugged){
      gs.plugged=plug;
      const def=other(G.attacker);
      if(G.playLive)log(def==="G"?"grey":"blue",
        plug?`${GATES[i].id} Gate is PLUGGED — ${inArea.length} hands come down on the pole as one.`
            :`${GATES[i].id} Gate is no longer plugged.`);
    }
    gs.seenCount*=Math.pow(0.5,dt/6); // threat memory decays
  });
  // kneeling visual + keep garrison men arranged in their slots
  for(const g of GATES){
    const def=other(G.attacker);
    const men=armyMen(def).filter(m=>m.homeGate===g.idx&&m.state==="idle"&&!m.path&&dist(m,g.pos)<130);
    men.forEach((m,k)=>{
      let slot;
      if(k<CFG.plugStrength){
        const row=k%4,col=Math.floor(k/4);
        slot={x:g.pos.x+g.perp.x*(row-1.5)*14+g.dx*(col===0?-6:6),
              y:g.pos.y+g.perp.y*(row-1.5)*14+g.dy*(col===0?-6:6)};
      }else{
        const j=k-CFG.plugStrength;
        slot={x:g.gateIn.x-g.dx*(16+Math.floor(j/5)*15)+g.perp.x*((j%5)-2)*15,
              y:g.gateIn.y-g.dy*(16+Math.floor(j/5)*15)+g.perp.y*((j%5)-2)*15};
      }
      const d=dist(m,slot);
      if(d>4){const sp=CFG.baseSpeed*0.9*dt;m.x+=(slot.x-m.x)/d*Math.min(sp,d);m.y+=(slot.y-m.y)/d*Math.min(sp,d)}
      m.plugKneel=G.gates[g.idx].plugged&&k<CFG.plugStrength;
    });
  }
}
function detectRoadClashes(dt){
  if(!G.playLive)return;
  const atk=G.attacker,def=other(atk);
  for(const g of GATES){
    const gs=G.gates[g.idx];
    if(gs.cooldown>0)continue;
    // defenders loitering in road areas, outside the gate itself
    const dRFA=armyMen(def).filter(m=>m.state!=="tempdead"&&m.state!=="centerdead"&&dist(m,g.pos)>=46&&inRFA(m,g));
    const dBFA=armyMen(def).filter(m=>m.state!=="tempdead"&&m.state!=="centerdead"&&inBFA(m,g));
    if(!dRFA.length&&!dBFA.length)continue;
    const aRFA=armyMen(atk).filter(m=>m.state!=="tempdead"&&m.state!=="centerdead"&&inRFA(m,g));
    const aBFA=armyMen(atk).filter(m=>m.state!=="tempdead"&&m.state!=="centerdead"&&inBFA(m,g));
    if(dBFA.length&&aBFA.length){
      gs.clashT=(gs.clashT||0)+dt;
      if(gs.clashT>0.8){
        gs.clashT=0;
        G.bfaClash={defN:dBFA.length,atkN:aBFA.length};
        const party=aBFA[0].partyId?getParty(aBFA[0].partyId):null;
        resolvePlay(g.idx,party,"bfa");
      }
    }else if(dRFA.length&&aRFA.length){
      gs.clashT=(gs.clashT||0)+dt;
      if(gs.clashT>0.8){
        gs.clashT=0;
        const diff=Math.abs(dRFA.length-aRFA.length);
        if(diff>0){
          const winner=dRFA.length>aRFA.length?def:atk;
          G.score[winner]+=diff;G.stats.challenges++;
          if(!G.autotest)haptic(winner===G.playerArmy?"score":"against");
          gs.cooldown=CFG.gateCooldown;G.freeze={gate:g.idx,t:CFG.whistleFreeze};
          SND.whistle(true);
          log("ump",`⟟ Challenge in the red flag area at ${g.id} — ${diff} point${diff===1?"":"s"}, ${ARMIES[winner].name}.`);
          banner(`CHALLENGE — ${diff} PTS ${ARMIES[winner].name}`,`Parties met in the red flag area at ${g.id} Gate`,2.4);
          const party=aRFA[0].partyId?getParty(aRFA[0].partyId):null;
          if(party)clearChargedParty(party,g,true);
          ui.hudDirty=true;
        }
      }
    }else gs.clashT=0;
  }
}

/* ---------------- AI: DEFENSE ---------------- */
function aiDefense(dt){
  const def=other(G.attacker);
  // the player's own defense only runs here when the aide-de-camp is switched on
  const isPlayer=def===G.playerArmy&&!G.autotest;
  if(isPlayer&&!G.aide)return;
  const ai=G.aiD;
  ai.think-=dt;
  if(!G.scoutsOut)return;
  if(ai.think>0)return;
  const REACT=isPlayer?1.9:[3.2,1.9,1.05][G.difficulty];       // camper / counselor / general
  const NOISE_W=isPlayer?0.9:[1.6,0.9,0.45][G.difficulty];     // how much callers fool this general
  ai.think=REACT*(0.75+rnd()*0.5);
  const now=CFG.quarterLen-G.clock;
  // the aide leaves alone any gate the general has given orders for in the last 25 seconds
  const locked=i=>isPlayer&&now-G.pTouch[i]<25;
  const men=armyMen(def).filter(m=>m.state!=="tempdead"&&m.state!=="centerdead");
  // threat estimate per gate
  const threat=GATES.map((g,i)=>{
    const gs=G.gates[i];
    // sightings now count each attacker once; SENS keeps the defense as alert as it was tuned
    const SENS=1.9;
    let t=gs.seenCount*1.4*SENS+gs.noise*NOISE_W;
    for(const gh of G.ghosts)if(gh.side===def){const d=dist(gh,g.pos);if(d<420)t+=gh.n*SENS*(1-d/420)}
    return t;
  });
  // lockdown when protecting a lead late in the last quarter
  const myLead=G.score[def]-G.score[G.attacker];
  const lockdown=(G.quarter===4&&G.clock<100&&myLead>0)||(G.quarter===4&&G.clock<45);
  // desired garrison sizes
  let desire;
  if(lockdown){
    desire=GATES.map(()=>Math.floor(men.length/6));
    for(let i=0;i<men.length%6;i++)desire[i]++;
    if(!ai.saidLockdown){ai.saidLockdown=true;
      log(def==="G"?"grey":"blue",`${isPlayer?"Your aide-de-camp":ARMIES[def].general} calls LOCKDOWN — knees in every gate, hold what we have.`)}
  }else{
    desire=GATES.map(()=>4);
    let spare=men.length-24;
    const order=threat.map((t,i)=>[t,i]).sort((a,b)=>b[0]-a[0]);
    for(const[t,i]of order){
      if(spare<=0)break;
      const want=t>7?CFG.plugStrength+2:(t>3?CFG.plugStrength:(t>1?6:4));
      const add=Math.min(spare,Math.max(0,want-desire[i]));
      desire[i]+=add;spare-=add;
    }
    // Camper-level generals occasionally miscount, Treat-in-2011 style
    if(!isPlayer&&G.difficulty===0&&rnd()<0.12){const i=rndi(0,5);desire[i]=Math.max(2,desire[i]-3)}
  }
  // gates the general set by hand keep the general's number
  if(isPlayer)for(let i=0;i<6;i++)if(G.pTarget[i]!=null&&locked(i))desire[i]=G.pTarget[i];
  // current garrison census
  const at=GATES.map(()=>[]);
  for(const m of men)if(m.homeGate>=0)at[m.homeGate].push(m);
  // move surplus toward deficit, one squadron per think
  let worst=-1,worstDef=0;
  for(let i=0;i<6;i++){if(locked(i))continue;const d=desire[i]-at[i].length;if(d>worstDef){worstDef=d;worst=i}}
  if(worst>=0&&worstDef>=2){
    let donor=-1,donorSur=0;
    for(let i=0;i<6;i++){if(locked(i))continue;const s=at[i].length-desire[i];if(s>donorSur){donorSur=s;donor=i}}
    if(donor>=0){
      const squad=at[donor].filter(m=>!m.path).slice(0,Math.min(worstDef,donorSur,6));
      if(squad.length){
        orderGarrison(squad,worst,{sprint:threat[worst]>4});
        if(G.playerArmy===G.attacker&&threat[worst]>4&&rnd()<0.5)
          log("flav",`A ${ARMIES[def].adj} squadron flag goes up — runners are moving.`);
        if(isPlayer)log(def==="G"?"grey":"blue",`Aide-de-camp: ${squad.length} men from ${GATES[donor].id} to ${GATES[worst].id}.`);
      }
    }
  }
  // initial deployment
  if(!ai.deployed){
    ai.deployed=true;
    for(let gi=0;gi<6;gi++){
      const squad=men.filter(m=>m.homeGate===gi);
      if(squad.length)orderGarrison(squad,gi,{});
    }
  }
}

/* ---------------- AI: ATTACK ---------------- */
function aiAttack(dt){
  const atk=G.attacker;
  if(atk===G.playerArmy&&!G.autotest)return;
  const ai=G.aiA;
  ai.think-=dt;ai.stageT+=dt;
  if(ai.think>0)return;
  const AGGR=[0.85,1.05,1.3][G.difficulty];
  ai.think=(1.5+rnd()*1.5)/AGGR;
  const now=CFG.quarterLen-G.clock;
  const men=armyMen(atk);
  const free=men.filter(m=>m.state==="idle"&&!m.path&&!m.caller);
  const idleFree=free.filter(m=>!m.partyId||!(getParty(m.partyId)||{}).role||["move","done"].includes((getParty(m.partyId)||{}).role));

  // knowledge of gates: fresh scouted counts or optimistic guess
  function knownDef(gi){
    const gs=G.gates[gi];
    if(now-gs.lastSeenByAtk<9)return {n:gs.atkSeenDef??4,plug:!!gs.atkSeenPlug,fresh:true};
    return {n:4,plug:false,fresh:false};
  }
  // abort charges that walked into strength
  for(const p of G.parties){
    if(p.army!==atk||p.role!=="charge")continue;
    if(["approach","form","wait"].includes(p.state)){
      const k=knownDef(p.targetGate);
      const alive=p.men.filter(m=>m.state!=="tempdead"&&m.state!=="centerdead");
      if(k.fresh&&(k.plug||k.n>=alive.length)){
        const g=GATES[p.targetGate];
        G.gates[p.targetGate].atkAbortT=now;
        clearChargedParty(p,g,false);
        log("flav",`${ARMIES[atk].adj} attackers melt back into the trees at ${g.id}.`);
      }
    }
  }
  if(!G.playLive){
    // spread out through the woods early
    if(ai.stage==="gather"&&idleFree.length){
      const staging=[GATES[rndi(0,5)],GATES[rndi(0,5)]];
      for(const g of staging){
        const grab=idleFree.splice(0,rndi(4,8));
        if(grab.length)orderMove(grab,roadOff(g,g.len+130,rnd()*160-80),{});
      }
      ai.stage="spread";
    }
    return;
  }
  // deploy callers once
  if(!ai.callersOut){
    ai.callersOut=true;
    const gi=rndi(0,5),gj=(gi+rndi(2,4))%6;
    const c1=idleFree.splice(0,2),c2=idleFree.splice(0,2);
    if(c1.length)orderCallers(c1,gi);
    if(c2.length)orderCallers(c2,gj);
    log("flav",`Away by the ${GATES[gi].id} road, ${ARMIES[atk].callerNoise}.`);
    if(atk==="B")SND.horn();else SND.drum();
  }
  // send scouts to watch gates
  const scouts=men.filter(m=>m.scout&&m.state!=="centerdead");
  if(scouts.length<3&&idleFree.length>6){
    const s=idleFree.splice(0,1)[0];
    if(s){const g=GATES[rndi(0,5)];
      orderMove([s],roadOff(g,g.bfaT,90),{scout:true})}
  }
  // main strikes
  const charging=G.parties.filter(p=>p.army===atk&&p.role==="charge").length;
  const wantCharges=(G.clock<70)?3:(idleFree.length>=14?2:1);
  if(charging<wantCharges&&idleFree.length>=4){
    // choose target: weakest known, discounting plugged
    let best=-1,bestScore=-1;
    for(let i=0;i<6;i++){
      const k=knownDef(i);
      if(k.fresh&&k.plug)continue;
      if(G.gates[i].atkAbortT!=null&&now-G.gates[i].atkAbortT<12)continue;
      let sc=10-k.n+(k.fresh?3:0)+rnd()*2.5;
      if(G.gates[i].cooldown>0)sc-=3;
      if(sc>bestScore){bestScore=sc;best=i}
    }
    if(best>=0){
      const k=knownDef(best);
      const eligible=idleFree.filter(eligibleToScore);
      const escortPool=idleFree.filter(m=>!eligibleToScore(m));
      const size=Math.min(eligible.length,Math.max(4,k.n+2+rndi(1,4)));
      if(size>=3&&size>=k.n+1){
        const party=eligible.slice(0,size).concat(escortPool.slice(0,rndi(0,2)));
        orderCharge(party,best);
      }else if(eligible.length>=k.n+1){
        orderCharge(eligible,best);
      }
    }
  }
  // rescue idle revived men back to a staging pocket
  const stragglers=idleFree.slice(0,0); // handled implicitly by next strike selection
}

/* ---------------- one-tap gate commands ----------------
   A simpler way to give the same orders: pick a gate and a number, and the
   nearest suitable men go. Underneath it is the same orderCharge / orderCallers /
   orderGarrison the classic controls use, so every rule and umpire call is unchanged. */
const nowT=()=>CFG.quarterLen-G.clock;
const aliveMan=m=>m.state!=="tempdead"&&m.state!=="centerdead";
function gateStage(g){return g.hasBlue?g.bfaPt:roadOff(g,g.rEnd+30)}
function attackPool(){ // attackers free for a new job: alive, not callers/scouts, not already in a charge
  return attackerMen().filter(m=>{
    if(!aliveMan(m)||m.caller||m.scout)return false;
    const p=m.partyId?getParty(m.partyId):null;
    return !(p&&p.role==="charge"&&p.targetGate>=0);
  });
}
function attackIntel(gi){ // what the attacking army knows about a gate's garrison
  const gs=G.gates[gi],age=nowT()-gs.lastSeenByAtk;
  if(age<10&&gs.atkSeenDef!=null)return{known:true,n:gs.atkSeenDef,plug:!!gs.atkSeenPlug,age};
  if(gs.atkSeenDef!=null)return{known:false,stale:true,n:gs.atkSeenDef,plug:!!gs.atkSeenPlug,age};
  return{known:false,stale:false,n:null,plug:false,age:Infinity};
}
function partiesAt(gi,army,role){return G.parties.filter(p=>p.army===army&&p.targetGate===gi&&p.role===role&&p.men.some(aliveMan))}
function recommendCharge(gi){
  const k=attackIntel(gi),pool=attackPool();
  let n=k.n!=null?k.n+2:6;
  return {n:clamp(n,1,Math.max(1,pool.length)),pool:pool.length,elig:pool.filter(eligibleToScore).length,k};
}
function sideKind(a){return a==="G"?"grey":"blue"}
function cmdCharge(gi,n){
  const g=GATES[gi],st=gateStage(g);
  const pool=attackPool().sort((a,b)=>dist(a,st)-dist(b,st));
  const elig=pool.filter(eligibleToScore),rest=pool.filter(m=>!eligibleToScore(m));
  // eligible men first; men at their scoring limit fill out the numbers (they still count in the gate)
  const party=elig.slice(0,n).concat(rest.slice(0,Math.max(0,n-elig.length)));
  if(!party.length)return 0;
  orderCharge(party,gi);
  log(sideKind(G.attacker),`Party of ${party.length} moves on the ${g.id} Gate.`);
  return party.length;
}
function helperPool(gi){ // for callers & scouts, prefer men who can't score any more
  const g=GATES[gi];
  return attackPool().sort((a,b)=>(eligibleToScore(a)-eligibleToScore(b))||(dist(a,g.roadEnd)-dist(b,g.roadEnd)));
}
function cmdCallers(gi,n){
  const men=helperPool(gi).slice(0,n||2);
  if(!men.length)return 0;
  orderCallers(men,gi);
  log(sideKind(G.attacker),`Callers posted at ${GATES[gi].id} — ${ARMIES[G.attacker].callerNoise}.`);
  if(!HEADLESS){if(G.attacker==="B")SND.horn();else SND.drum()}
  return men.length;
}
function cmdScout(gi){
  const s=helperPool(gi)[0],g=GATES[gi];
  if(!s)return 0;
  const side=(GATES.indexOf(g)%2?1:-1);
  orderMove([s],roadOff(g,g.bfaT,90*side),{scout:true});
  log(sideKind(G.attacker),`A scout slips off toward the ${g.id} road to count heads.`);
  return 1;
}
function cmdRecall(gi){
  const army=G.attacker,g=GATES[gi];let n=0;
  for(const p of G.parties.slice()){
    if(p.army!==army||p.targetGate!==gi||!["charge","callers"].includes(p.role))continue;
    const men=p.men.filter(aliveMan);
    if(men.length){orderMove(men,{x:G.rally.x,y:G.rally.y},{});n+=men.length}
  }
  const scouts=attackerMen().filter(m=>m.scout&&aliveMan(m)&&dist(m,g.pos)<300);
  if(scouts.length){orderMove(scouts,{x:G.rally.x,y:G.rally.y},{});n+=scouts.length}
  return n;
}
/* defense */
function defMenAlive(){return defenderMen().filter(aliveMan)}
function garrisonOf(gi){return defMenAlive().filter(m=>m.homeGate===gi)}
function threatScore(gi,side){
  const g=GATES[gi],gs=G.gates[gi];
  let t=gs.seenCount*1.4*1.9+gs.noise*0.9;
  for(const gh of G.ghosts)if(gh.side===side){const d=dist(gh,g.pos);if(d<420)t+=gh.n*1.9*(1-d/420)}
  return t;
}
function gateSighting(gi,side){ // biggest recent sighting near a gate, for the defender's panel
  const g=GATES[gi];let best=null;
  for(const gh of G.ghosts)if(gh.side===side){const d=dist(gh,g.pos);
    if(d<420&&(!best||gh.n>best.n))best={n:gh.n,age:nowT()-gh.t}}
  return best;
}
function floorFor(i){return G.pTarget[i]!=null?G.pTarget[i]:3}
function cmdSetGarrison(gi,n,sprint){
  const def=other(G.attacker),men=defMenAlive(),now=nowT(),to=GATES[gi].pos;
  const at=GATES.map(()=>[]),loose=[];
  for(const m of men){if(m.homeGate>=0)at[m.homeGate].push(m);else loose.push(m)}
  G.pTarget[gi]=n;G.pTouch[gi]=now;
  const cur=at[gi].length;
  const send=(group,dest)=>{ // one squad per source gate so each runs its own route
    const bySrc=new Map();
    for(const m of group){const k=m.homeGate;if(!bySrc.has(k))bySrc.set(k,[]);bySrc.get(k).push(m)}
    for(const sq of bySrc.values())orderGarrison(sq,dest,{sprint});
  };
  if(cur<n){
    let need=n-cur;const picked=[];
    loose.sort((a,b)=>dist(a,to)-dist(b,to));
    while(need>0&&loose.length){picked.push(loose.shift());need--}
    const threat=GATES.map((g,i)=>threatScore(i,def));
    const donors=GATES.map((g,i)=>({i,men:at[i].slice().sort((a,b)=>dist(a,to)-dist(b,to))})).filter(d=>d.i!==gi);
    while(need>0){
      let best=null;
      for(const d of donors){const sur=d.men.length-floorFor(d.i);if(sur<=0)continue;
        const key=threat[d.i]*2-sur+dist(GATES[d.i].pos,to)/400;
        if(!best||key<best.key)best={d,key}}
      if(!best)break;
      picked.push(best.d.men.shift());need--;
    }
    if(picked.length)send(picked,gi);
    return {moved:picked.length,short:need};
  }
  if(cur>n){
    const extra=at[gi].slice().sort((a,b)=>dist(b,to)-dist(a,to)).slice(0,cur-n);
    let tgt=-1,best=-1e9;
    for(let i=0;i<6;i++){if(i===gi)continue; // the thinnest, most threatened gate gets them
      const sc=threatScore(i,def)*1.5-at[i].length+(G.pTarget[i]!=null?(G.pTarget[i]-at[i].length)*2:0);
      if(sc>best){best=sc;tgt=i}}
    if(tgt>=0)send(extra,tgt);
    return {moved:-extra.length,to:tgt};
  }
  return {moved:0};
}
function deployPlayerGarrisons(){ // at "Scouts out" the player's garrisons walk to their gates
  const def=other(G.attacker);
  if(def!==G.playerArmy||G.autotest)return;
  for(let gi=0;gi<6;gi++){
    const squad=defMenAlive().filter(m=>m.homeGate===gi&&!m.path&&!m.partyId);
    if(squad.length)orderGarrison(squad,gi,{});
  }
  G.aiD.deployed=true;
  log(sideKind(def),"Garrisons take their gates — six or seven men at each. Tap a gate to shift them.");
}

/* ---------------- master tick ---------------- */
function tick(dt){
  if(!G||G.paused||G.over||G.hold)return;
  if(G.phase!=="play")return;
  dt*=G.speed;
  G.tPlay+=dt;
  updatePhase(dt);
  if(G.playLive){
    G.clock-=dt;
    if(G.clock<=0){G.clock=0;endQuarter();return}
  }
  // whistle freeze
  let frozenGate=-1;
  if(G.freeze){G.freeze.t-=dt;if(G.freeze.t<=0)G.freeze=null;else frozenGate=G.freeze.gate}
  for(const m of G.men){
    if(m.state==="centerdead"){if(m.path)moveMan(m,dt);continue}
    if(frozenGate>=0&&dist(m,GATES[frozenGate].pos)<175)continue;
    if(m.state==="tempdead"){
      if(m.path)moveMan(m,dt);
      else{m.deadTimer-=dt;if(m.deadTimer<=0){m.state="idle";}}
      continue;
    }
    const canMove=(m.army===G.attacker)?(G.tPlay>=CFG.attackersOutAt):(G.scoutsOut);
    if(canMove&&m.path)moveMan(m,dt);
  }
  G._sightT=(G._sightT||0)-dt;
  if(G._sightT<=0){G._sightT=0.25;updateSighting(dt)}
  if(G.playLive){updateCharges(dt);detectRoadClashes(dt);maybeEndEarly(dt)}
  updateGates(dt);
  updateFlavor(dt);
  aiDefense(dt);
  aiAttack(dt);
}

/* ---------------- UI (all DOM access lives here) ---------------- */

  maxZoom(){return Math.max(2.2,1.25/(this.fit||1))},
  homeCam(){ // the whole field on wide screens; on tall phones, zoom so the town and its six gates fill the width
    const vp=this.vp;let z=1;
    if(vp&&vp.h>vp.w*1.05)z=clamp((vp.w-8)/880/this.fit,1,this.maxZoom());
    this.cam={z,cx:z>1?780:FOCUS.x+FOCUS.w/2,cy:z>1?610:FOCUS.y+FOCUS.h/2};this.applyCam();
  },
  applyCam(){
    if(HEADLESS||!this.vp)return;
    const W=CFG.worldW,H=CFG.worldH,vp=this.vp,cam=this.cam;
    cam.z=clamp(cam.z,1,this.maxZoom());
    const sc=this.fit*cam.z,hw=vp.w/2/sc,hh=vp.h/2/sc;
    cam.cx=(W<=2*hw)?W/2:clamp(cam.cx,hw,W-hw);
    cam.cy=(H<=2*hh)?H/2:clamp(cam.cy,hh,H-hh);
    if(cam.z===1&&W>2*hw){cam.cx=clamp(FOCUS.x+FOCUS.w/2,hw,W-hw)}
    if(cam.z===1&&H>2*hh){cam.cy=clamp(FOCUS.y+FOCUS.h/2,hh,H-hh)}
    this.view={scale:sc,ox:vp.x+vp.w/2-cam.cx*sc,oy:vp.y+vp.h/2-cam.cy*sc,dpr:window.devicePixelRatio||1};
  },
  zoomAt(px,py,z){ // zoom keeping the world point under (px,py) still
    const w=this.toWorld(px,py);
    this.cam.z=clamp(z,1,this.maxZoom());
    const sc=this.fit*this.cam.z,vp=this.vp;
    this.cam.cx=w.x-(px-(vp.x+vp.w/2))/sc;this.cam.cy=w.y-(py-(vp.y+vp.h/2))/sc;
    this.applyCam();
  },
  panBy(dx,dy){const sc=this.view.scale;this.cam.cx-=dx/sc;this.cam.cy-=dy/sc;this.applyCam()},
  toWorld(px,py){const v=this.view;return{x:(px-v.ox)/v.scale,y:(py-v.oy)/v.scale}},
  /* ---------- gate buttons (bottom bar) ---------- */
  buildChips(){

  syncChips(){
    if(HEADLESS||!G||G.phase!=="play")return;

    GATES.forEach((g,i)=>{
      const b=this.el("chip-"+i);if(!b)return;
      let txt,threat=false,plug=false,noise=false;
      if(atk){
        const k=attackIntel(i);
        txt=k.n==null?"?":(k.known?k.n:k.n+"~");plug=k.plug;if(plug)txt+="⊕";
        const mine=partiesAt(i,me,"charge").reduce((s,p)=>s+p.men.filter(aliveMan).length,0);
        if(mine)txt+=" →"+mine;
      }else{

      }

      b.classList.toggle("threat",threat);b.classList.toggle("noise",noise&&!threat);b.classList.toggle("plug",plug);
      b.classList.toggle("open",!!(this.gp&&this.gp.gi===i));

  openGate(gi){

  },
  closeGate(){
    if(HEADLESS)return;
    this.gp=null;if(G)G.hold=false;

  refreshGate(){
    if(HEADLESS||!this.gp||!G)return;
    if(G.phase!=="play"||G.over){this.closeGate();return}
    const {gi,atk}=this.gp,g=GATES[gi],E=id=>this.el(id);
    const sel=commandable();
    E("gp-selrow").style.display=sel.length?"flex":"none";
    E("gp-sel").textContent=`Send my ${sel.length} selected men here`;
    let intel,hint="",hcls="";
    if(atk){
      const r=recommendCharge(gi),k=r.k;
      this.gp.n=clamp(this.gp.n,1,Math.max(1,r.pool));
      const n=this.gp.n;
      intel=k.known?`<b>${k.n}</b> guard${k.n===1?"":"s"} in this gate right now${k.plug?` — <b class="warn">PLUGGED, can't be beaten</b>`:""}.`:
        k.stale?`<b>${k.n}</b> guard${k.n===1?"":"s"}${k.plug?" (plugged)":""}, seen ${Math.round(k.age)}s ago. They may have moved.`:
        `You don't know how many guards are here. <b>Scout it</b> first, or take a chance.`;
      const going=partiesAt(gi,G.playerArmy,"charge").reduce((s,p)=>s+p.men.filter(aliveMan).length,0);
      const calling=partiesAt(gi,G.playerArmy,"callers").reduce((s,p)=>s+p.men.filter(aliveMan).length,0);
      intel+=`<br><span style="color:var(--ink-soft)">You have <b>${r.pool}</b> men free.</span>`+
        (going?` ${going} already on the way.`:"")+(calling?` ${calling} making noise.`:"");
      if(k.n!=null&&k.plug){hint=`Plugged — pick another gate`;hcls="bad"}
      else if(k.n!=null){
        if(n>k.n){hint=`✓ ${n} beats ${k.n}`;hcls="good"}
        else if(n===k.n){hint=`Tie = bounced out. Send ${k.n+1}+`;hcls="bad"}
        else{hint=`Too few. Send ${k.n+1}+`;hcls="bad"}
      }else hint=`Beat the guards' number to score`;
      E("gp-go").innerHTML=`Attack ${g.id} with ${n}<small>every man who gets in scores</small>`;E("gp-go").disabled=!r.pool;
      const hp=helperPool(gi).length;
      E("gp-callers").disabled=!hp;E("gp-scout").disabled=!hp;
    }else{
      const here=menInGateArea(gi).length,gar=garrisonOf(gi),enroute=gar.filter(m=>m.path).length;
      this.gp.n=clamp(this.gp.n,0,CFG.armySize);
      const n=this.gp.n,s=gateSighting(gi,G.playerArmy),gs=G.gates[gi];
      intel=`<b>${here}</b> guarding now${gs.plugged?` — <b>plugged</b>`:""}${enroute?` (${enroute} more on the way)`:""}.<br>`+
        (s&&s.age<12?`<b class="warn">${s.n} attackers spotted near ${g.id}</b> (${Math.round(s.age)}s ago). Have more guards than that.`:
         gs.noise>0?`Noise out on this road — might be a trick.`:`<span style="color:var(--ink-soft)">Quiet out there.</span>`);
      const spare=GATES.reduce((t,_,i)=>i===gi?t:t+Math.max(0,garrisonOf(i).length-floorFor(i)),0);
      intel+=`<br><span style="color:var(--ink-soft)">${spare} spare guards at other gates.</span>`;
      hint=n>=CFG.plugStrength?`Plugged — stops any attack`:(n===0?`Empty — anyone walks in`:`Stops up to ${n} attackers`);
      hcls=n>=CFG.plugStrength?"good":(n===0?"bad":"");
      E("gp-go").innerHTML=n===gar.length?`Keep ${n} here`:`Set ${g.id} to ${n}<small>nearest spare guards walk over</small>`;
      E("gp-aide").innerHTML=`Helper: ${G.aide?"ON":"off"}<small>moves guards for you</small>`;
    }
    E("gp-intel").innerHTML=intel;
    E("gp-n").textContent=this.gp.n;

function doLockdown(){
  const def=other(G.attacker);
  if(G.playerArmy!==def)return;
  const men=armyMen(def).filter(m=>m.state!=="tempdead"&&m.state!=="centerdead");
  const per=Math.floor(men.length/6);let k=0;
  for(let gi=0;gi<6;gi++){
    const squad=men.slice(k,k+per+(gi<men.length%6?1:0));k+=squad.length;
    if(squad.length)orderGarrison(squad,gi,{});
    G.pTarget[gi]=squad.length;G.pTouch[gi]=nowT();
  }
  log(def==="G"?"grey":"blue",`${ARMIES[def].general} calls LOCKDOWN — every gate manned, knees in the pine needles.`);
  setTip("Lockdown: all six gates held thin. Boring, effective, watermelon gummies optional.");
}
