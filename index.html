  maxZoom(){return Math.max(2.2,1.25/(this.fit||1))},
  homeCam(){ // the whole field on wide screens; on tall phones, zoom so the town and its six gates fill the width
    const vp=this.vp;let z=1;
    if(vp&&vp.h>vp.w*1.05)z=clamp((vp.w-8)/900/this.fit,1,this.maxZoom());
    this.cam={z,cx:z>1?790:FOCUS.x+FOCUS.w/2,cy:z>1?610:FOCUS.y+FOCUS.h/2};this.applyCam();
  },
  applyCam(){
    if(HEADLESS||!this.vp)return;
    const W=CFG.worldW,H=CFG.worldH,vp=this.vp,cam=this.cam;
    cam.z=clamp(cam.z,1,this.maxZoom());
    const sc=this.fit*cam.z,hw=vp.w/2/sc,hh=vp.h/2/sc;
    cam.cx=(W<=2*hw)?W/2:clamp(cam.cx,hw,W-hw);
    cam.cy=(H<=2*hh)?H/2:clamp(cam.cy,hh,H-hh);
    if(cam.z===1&&W>2*hw){cam.cx=clamp(FOCUS.x+FOCUS.w/2,hw,W-hw)}
    if(cam.z===1&&H>2*hh){cam.cy=clamp(FOCUS.y+FOCUS.h/2,hh,H-hh)}
    this.view={scale:sc,ox:vp.x+vp.w/2-cam.cx*sc,oy:vp.y+vp.h/2-cam.cy*sc,dpr:window.devicePixelRatio||1};
  },
  zoomAt(px,py,z){ // zoom keeping the world point under (px,py) still
    const w=this.toWorld(px,py);
    this.cam.z=clamp(z,1,this.maxZoom());
    const sc=this.fit*this.cam.z,vp=this.vp;
    this.cam.cx=w.x-(px-(vp.x+vp.w/2))/sc;this.cam.cy=w.y-(py-(vp.y+vp.h/2))/sc;
    this.applyCam();
  },
  panBy(dx,dy){const sc=this.view.scale;this.cam.cx-=dx/sc;this.cam.cy-=dy/sc;this.applyCam()},
  toWorld(px,py){const v=this.view;return{x:(px-v.ox)/v.scale,y:(py-v.oy)/v.scale}},
  /* ---------- gate buttons (bottom bar) ---------- */

        k.stale?`<b>${k.n}</b> guard${k.n===1?"":"s"}${k.plug?" (plugged)":""}, seen ${Math.round(k.age)}s ago. They may have moved.`:

function doLockdown(){
  const def=other(G.attacker);
  if(G.playerArmy!==def)return;
  const men=armyMen(def).filter(m=>m.state!=="tempdead"&&m.state!=="centerdead");
  const per=Math.floor(men.length/6);let k=0;
  for(let gi=0;gi<6;gi++){
    const squad=men.slice(k,k+per+(gi<men.length%6?1:0));k+=squad.length;
    if(squad.length)orderGarrison(squad,gi,{});
    G.pTarget[gi]=squad.length;G.pTouch[gi]=nowT();
  }
  log(def==="G"?"grey":"blue",`${ARMIES[def].general} calls LOCKDOWN — every gate manned, knees in the pine needles.`);
  setTip("Lockdown: all six gates held thin. Boring, effective, watermelon gummies optional.");
}
function togglePause(){
  if(!G)return;G.paused=!G.paused;
  ui.el("btn-pause").classList.toggle("on",G.paused);ui.el("btn-pause").textContent=G.paused?"▶":"❙❙";
  if(G.paused)banner("PAUSED","Tap ▶ to resume",1.6);

function commandable(){
  if(!G)return[];
  return G.selection.filter(m=>m.army===G.playerArmy&&m.state!=="tempdead"&&m.state!=="centerdead");
}
function armOrder(kind){
  G.armedOrder=(G.armedOrder===kind)?null:kind;
  ui.syncArmed();
  const tips={charge:"Charge armed — click a gate. Your party steps in together; make sure you outnumber what's inside.",
    callers:"Callers armed — click a gate to post noisemakers by its road.",
    move:"Move armed — click anywhere.",
    garrison:"Garrison armed — click a gate to send the selected men.",
    sprint:"Sprint armed — click a gate; the squadron runs flat out (watch their wind)."};
  setTip(G.armedOrder?tips[kind]:"");
}

/* ---------------- input ---------------- */
let dragStart=null,dragCur=null;
const ptrs=new Map();let gest=null,lastTap={t:0,x:0,y:0};
function bindInput(cv){
  cv.addEventListener("contextmenu",e=>e.preventDefault());
  cv.addEventListener("pointerdown",e=>{
    SND.poke();
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2){ // pinch
      const[a,b]=[...ptrs.values()];
      gest={type:"pinch",d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:ui.cam.z};dragStart=null;dragCur=null;return}
    if(ptrs.size>2)return;
    const w=ui.toWorld(e.clientX,e.clientY);
    if(e.pointerType==="mouse"){
      if(e.button===2){if(G&&G.phase==="play")contextOrder(w);gest=null;return}
      if(e.button===1){gest={type:"pan",x:e.clientX,y:e.clientY,moved:true};e.preventDefault();return}
      gest={type:"mouse",sx:e.clientX,sy:e.clientY,w0:w,moved:false,shift:e.shiftKey};
    }else{
      gest={type:"touch",sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,moved:false,t:performance.now()};
    }
  });
  cv.addEventListener("pointermove",e=>{
    const p=ptrs.get(e.pointerId);if(p){p.x=e.clientX;p.y=e.clientY}
    if(G&&e.pointerType==="mouse"){const w=ui.toWorld(e.clientX,e.clientY);G.hoverGate=gateHit(w)}
    if(!gest)return;
    if(gest.type==="pinch"&&ptrs.size>=2){
      const[a,b]=[...ptrs.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y)||1;
      ui.zoomAt((a.x+b.x)/2,(a.y+b.y)/2,gest.z0*d/gest.d0);return}
    if(gest.type==="touch"||gest.type==="pan"){
      if(!gest.moved&&Math.hypot(e.clientX-gest.sx,e.clientY-gest.sy)>9)gest.moved=true;
      if(gest.moved){ui.panBy(e.clientX-(gest.x??e.clientX),e.clientY-(gest.y??e.clientY))}
      gest.x=e.clientX;gest.y=e.clientY;return}
    if(gest.type==="mouse"){
      if(!gest.moved&&Math.hypot(e.clientX-gest.sx,e.clientY-gest.sy)>6)gest.moved=true;
      if(gest.moved&&G&&G.phase==="play"&&!G.armedOrder){dragStart=gest.w0;dragCur=ui.toWorld(e.clientX,e.clientY)}
    }
  });
  const up=e=>{
    ptrs.delete(e.pointerId);
    if(!gest)return;
    const g=gest;
    if(g.type==="pinch"){if(ptrs.size===0)gest=null;else gest={type:"touch",sx:0,sy:0,moved:true};return}
    gest=null;
    if(e.type==="pointercancel"){dragStart=null;dragCur=null;return}
    const w=ui.toWorld(e.clientX,e.clientY);
    if(g.type==="touch"&&!g.moved){
      const now=performance.now();
      if(now-lastTap.t<320&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<30&&gateHit(w)<0){ // double-tap zoom
        lastTap.t=0;ui.zoomAt(e.clientX,e.clientY,ui.cam.z>1.15?1:Math.min(ui.maxZoom(),2.4));return}
      lastTap={t:now,x:e.clientX,y:e.clientY};
      tapAt(w,false,true);return}
    if(g.type==="mouse"){
      if(dragStart&&dragCur){boxSelect(dragStart,dragCur,g.shift);dragStart=null;dragCur=null;return}
      dragStart=null;dragCur=null;
      if(!g.moved)tapAt(w,g.shift,false);
    }
  };
  cv.addEventListener("pointerup",up);
  cv.addEventListener("pointercancel",up);
  cv.addEventListener("dblclick",e=>{const w=ui.toWorld(e.clientX,e.clientY);
    if(gateHit(w)<0)ui.zoomAt(e.clientX,e.clientY,ui.cam.z>1.15?1:2)});
  cv.addEventListener("wheel",e=>{e.preventDefault();
    ui.zoomAt(e.clientX,e.clientY,ui.cam.z*Math.exp(-e.deltaY*0.0016))},{passive:false});
}
function gateHit(w){ // generous, screen-size-aware hit test for gates and their roads
  const r=Math.max(58,30/(ui.view.scale||1));
  return nearestGateTo(w,r);
}
function tapAt(w,shift,touch){
  if(!G||G.phase!=="play")return;
  if(G.armedOrder){executeArmed(w);return}
  const gi=gateHit(w);
  if(gi>=0){ui.openGate(gi);return}
  if(ui.gp){ui.closeGate();return}
  // one of your own men? select his whole party
  const r=Math.max(14,(touch?22:12)/(ui.view.scale||1));
  let best=null,bd=r;
  for(const m of armyMen(G.playerArmy)){if(m.state==="centerdead")continue;const d=dist(m,w);if(d<bd){bd=d;best=m}}
  if(best){
    const p=best.partyId?getParty(best.partyId):null;
    let picked=p?p.men.filter(m=>m.state!=="centerdead"):[best];
    if(G.playerArmy!==G.attacker&&best.homeGate>=0&&(!p||p.role==="garrison"))picked=garrisonOf(best.homeGate);
    G.selection=shift?[...new Set(G.selection.concat(picked))]:picked;
    ui.syncSelInfo();setTip(`${picked.length} men selected. ${touch?"Tap":"Click"} a gate to send them${touch?", or tap the map to move them":""}.`);
    return;
  }
  const sel=commandable();
  if(touch&&sel.length){orderMove(sel,w,{});setTip(`${sel.length} men on the move.`);return}
  if(!shift&&G.selection.length){G.selection=[];ui.syncSelInfo()}
}
function boxSelect(a,b,shift){
  if(!G)return;
  const x0=Math.min(a.x,b.x),x1=Math.max(a.x,b.x),y0=Math.min(a.y,b.y),y1=Math.max(a.y,b.y);
  const picked=armyMen(G.playerArmy).filter(m=>m.state!=="centerdead"&&m.x>=x0&&m.x<=x1&&m.y>=y0&&m.y<=y1);
  G.selection=shift?[...new Set(G.selection.concat(picked))]:picked;
  ui.syncSelInfo();
}
function nearestGateTo(w,maxD){
  let gi=-1,bd=maxD||70;
  GATES.forEach((g,i)=>{const d=Math.min(dist(w,g.pos),dist(w,g.rfaPt),dist(w,g.bfaPt));if(d<bd){bd=d;gi=i}});
  return gi;
}
function executeArmed(w){
  const kind=G.armedOrder;
  const sel=commandable();
  const gi=nearestGateTo(w,RFA_END);
  if(!sel.length){setTip("Select some men first.");G.armedOrder=null;ui.syncArmed();return}
  if(kind==="move"){orderMove(sel,w,{})}
  else if(kind==="charge"){
    if(gi<0){setTip("Click a gate to charge.");return}
    orderCharge(sel,gi);
    log(G.playerArmy==="G"?"grey":"blue",`Party of ${sel.length} moves on the ${GATES[gi].id} Gate.`);
  }
  else if(kind==="callers"){
    if(gi<0){setTip("Click a gate to post callers.");return}
    orderCallers(sel,gi);
    log(G.playerArmy==="G"?"grey":"blue",`Callers posted at ${GATES[gi].id} — ${ARMIES[G.playerArmy].callerNoise}.`);
    if(G.playerArmy==="B")SND.horn();else SND.drum();
  }
  else if(kind==="garrison"||kind==="sprint"){
    if(gi<0){setTip("Click a gate.");return}
    orderGarrison(sel,gi,{sprint:kind==="sprint"});
  }
  G.armedOrder=null;ui.syncArmed();ui.syncSelInfo();
}
function contextOrder(w){
  const sel=commandable();
  if(!sel.length)return;
  const gi=nearestGateTo(w,80);
  if(G.playerArmy===G.attacker){
    if(gi>=0){orderCharge(sel,gi);log(sideKind(G.playerArmy),`Party of ${sel.length} moves on the ${GATES[gi].id} Gate.`)}
    else orderMove(sel,w,{});
  }else{
    if(gi>=0)orderGarrison(sel,gi,{sprint:false});
    else orderMove(sel,w,{});
  }
}
function onKey(e){
  if(!G||G.phase!=="play")return;
  if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if(k===" "){togglePause();e.preventDefault();return}
  const pan={arrowleft:[60,0],arrowright:[-60,0],arrowup:[0,60],arrowdown:[0,-60]}[k];
  if(pan){ui.panBy(pan[0],pan[1]);e.preventDefault();return}
  if(k==="+"||k==="="){ui.zoomAt(innerWidth/2,innerHeight/2,ui.cam.z*1.25);return}
  if(k==="-"||k==="_"){ui.zoomAt(innerWidth/2,innerHeight/2,ui.cam.z/1.25);return}
  if(k==="escape"&&ui.gp){ui.closeGate();return}
  if(k>="1"&&k<="6"){
    const gi=+k-1;
    if(G.playerArmy!==G.attacker){
      G.selection=armyMen(G.playerArmy).filter(m=>m.homeGate===gi&&m.state!=="centerdead");
      ui.syncSelInfo();setTip(`${GATES[gi].id} Gate garrison selected (${G.selection.length} men).`);
    }
    return;
  }
  if(k==="e"){G.selection=armyMen(G.playerArmy).filter(m=>m.state!=="centerdead");ui.syncSelInfo();setTip("Whole army selected.")}
  const atk=G.playerArmy===G.attacker;
  if(atk&&k==="a")armOrder("charge");
  if(atk&&k==="c")armOrder("callers");
  if(atk&&k==="f"){const s=commandable();if(s.length)orderMove(s,{x:G.rally.x,y:G.rally.y},{})}
  if(!atk&&k==="g")armOrder("garrison");
  if(!atk&&k==="s")armOrder("sprint");
  if(!atk&&k==="l")doLockdown();
  if(k==="m")armOrder("move");
  if(k==="escape"){G.armedOrder=null;ui.syncArmed();setTip("")}
}

/* ---------------- dynamic rendering ---------------- */
function pill(c,txt,x,y,px,bg,fg){
  c.font=serifFont(px,true);c.textAlign="center";c.textBaseline="middle";
  const w=c.measureText(txt).width+px*1.1,h=px*1.75;

function render(dt){
  if(HEADLESS)return;
  const c=ui.ctx,v=ui.view,dpr=v.dpr||1;
  c.setTransform(dpr,0,0,dpr,0,0);
  c.fillStyle=TERRAIN?"#3a3524":"#4c6840";c.fillRect(0,0,innerWidth,innerHeight);
  if(!MAPIMG)buildMap();
  c.setTransform(dpr*v.scale,0,0,dpr*v.scale,dpr*v.ox,dpr*v.oy);
  c.drawImage(MAPIMG,0,0);
  if(!G)return;
  const now=performance.now()/1000;
  const viewer=G.playerArmy,enemy=other(viewer);
  const viewerIsAtk=viewer===G.attacker;

  // gate status overlays
  GATES.forEach((g,i)=>{
    const gs=G.gates[i];
    // caller noise arcs
    if(gs.noise>0){
      c.strokeStyle="rgba(212,162,76,.8)";c.lineWidth=2.5;
      for(let k=0;k<3;k++){
        const r=12+((now*36+k*17)%52);
        c.globalAlpha=1-r/60;
        c.beginPath();c.arc(g.roadEnd.x+g.dx*-40,g.roadEnd.y+g.dy*-40,r,0,7);c.stroke();
      }
      c.globalAlpha=1;
    }
    // whistle freeze / cooldown
    if(G.freeze&&G.freeze.gate===i){
      pill(c,"WHISTLE — PLAY OFF",g.pos.x,g.pos.y-46,12,"#cf4b3c","#fff");
    }else if(gs.cooldown>0){
      pill(c,"PLAY RESUMES "+Math.ceil(gs.cooldown)+"s",g.pos.x,g.pos.y-44,10,"rgba(18,24,22,.88)","#f0ecd6");
    }
    // garrison badge
    let label=null,bg="#fff",fg="#16211b";
    bg="rgba(18,24,22,.88)";fg="#f0ecd6";
    if(!viewerIsAtk){label=gs.def+(gs.plugged?" PLUGGED":"");if(gs.plugged){bg="#d4a24c";fg="#16120a"}}
    else{
      const age=(CFG.quarterLen-G.clock)-gs.lastSeenByAtk;
      if(age<10){label=(gs.atkSeenDef??"?")+(gs.atkSeenPlug?" PLUGGED":"");if(age>=5){fg="#97a39c"}}
      else label="?";
    }
    if(label!=null){const us=clamp(0.7/v.scale,1,2.2);
      pill(c,label,g.pos.x+g.perp.x*58,g.pos.y+g.perp.y*58,12*us,bg,fg)}
    // open-panel / hover / armed highlight
    if(ui.gp&&ui.gp.gi===i){
      const r=44+Math.sin(now*4)*4;
      c.strokeStyle="#d4a24c";c.lineWidth=3.5;
      c.beginPath();c.arc(g.pos.x,g.pos.y,r,0,7);c.stroke();
      c.lineWidth=2;c.setLineDash([6,5]);
      c.beginPath();c.moveTo(g.pos.x,g.pos.y);c.lineTo(g.roadEnd.x,g.roadEnd.y);c.stroke();c.setLineDash([]);
    }else if(G.hoverGate===i){
      c.strokeStyle=G.armedOrder?"#d4a24c":"rgba(240,236,214,0.6)";c.lineWidth=2.5;
      c.beginPath();c.arc(g.pos.x,g.pos.y,40,0,7);c.stroke();
    }
  });

  // visibility of enemy men
  const myMen=armyMen(viewer).filter(m=>m.state!=="centerdead");
  function enemyVisible(m){
    if(G.phase!=="play")return true;
    const r=viewerIsAtk?CFG.attackerSight:CFG.sightBase*(inForest(m)?CFG.sightForestTargetMult:1)*(onRoad(m)?1.35:1);
    for(const mm of myMen)if(dist(mm,m)<r)return true;
    return false;
  }
  // ghosts (your army's memory of sighted parties)
  for(const gh of G.ghosts){
    if(gh.side!==viewer)continue;
    const age=(CFG.quarterLen-G.clock)-gh.t;
    const al=clamp(1-age/CFG.ghostFade,0,1)*0.8;
    c.globalAlpha=al;
    const us=clamp(0.7/v.scale,1,2.2);
    c.strokeStyle="#cf4b3c";c.lineWidth=2*us;c.setLineDash([5*us,4*us]);
    c.beginPath();c.arc(gh.x,gh.y,16*us,0,7);c.stroke();c.setLineDash([]);
    pill(c,gh.n+" SPOTTED",gh.x,gh.y-24*us,10*us,"#cf4b3c","#fff");
    c.globalAlpha=1;
  }
  // men
  for(const m of G.men){
    const own=m.army===viewer;
    if(!own&&!enemyVisible(m))continue;
    const A=ARMIES[m.army];
    const sel=own&&G.selection.includes(m);
    const r=Math.max(6.5,3.6/v.scale);
    c.globalAlpha=(m.state==="centerdead")?0.35:(m.state==="tempdead"?0.55:1);
    c.fillStyle="rgba(0,0,0,.28)";c.beginPath();c.arc(m.x+r*0.18,m.y+r*0.3,r,0,7);c.fill();
    if(sel){c.fillStyle="#d4a24c";c.beginPath();c.arc(m.x,m.y,r+r*0.45,0,7);c.fill()}
    c.fillStyle=A.color;c.beginPath();c.arc(m.x,m.y,r,0,7);c.fill();
    c.strokeStyle="rgba(245,242,230,.95)";c.lineWidth=r*0.22;c.stroke();
    if(m.state==="tempdead"){ // out — hands on head
      c.strokeStyle="#fff";c.lineWidth=r*0.3;c.beginPath();
      c.moveTo(m.x-r*0.45,m.y-r*0.45);c.lineTo(m.x+r*0.45,m.y+r*0.45);c.moveTo(m.x+r*0.45,m.y-r*0.45);c.lineTo(m.x-r*0.45,m.y+r*0.45);c.stroke();
    }
    if(m.caller){
      c.strokeStyle="rgba(212,162,76,.9)";c.lineWidth=r*0.25;
      const rr2=r+((now*22+m.id*7)%(r*2.5));
      c.globalAlpha=Math.max(0,1-(rr2-r)/(r*2.5));
      c.beginPath();c.arc(m.x,m.y,rr2,0,7);c.stroke();
      c.globalAlpha=1;
    }
    c.globalAlpha=1;
  }
  // party badges for own charging/caller parties
  for(const p of G.parties){
    if(p.army!==viewer||!["charge","callers"].includes(p.role))continue;
    const alive=p.men.filter(m=>m.state!=="tempdead"&&m.state!=="centerdead");
    if(alive.length<2)continue;
    const pc=partyCenter(p);
    const us=clamp(0.7/v.scale,1,2.2);
    pill(c,(p.role==="charge"?"ATTACK ":"NOISE ")+alive.length,pc.x,pc.y-22*us,10*us,ARMIES[p.army].dark,"#fff");
    if(p.state==="form"||p.state==="step")
      pill(c,p.state==="form"?"READY, READY…":"ONE, TWO, STEP!",pc.x,pc.y+22*us,10*us,"#d4a24c","#16120a");
  }
  // rally marker & muster beacon (attacking)
  if(viewerIsAtk&&G.rally){
    const us=clamp(0.7/v.scale,1,2.2);
    pill(c,"YOUR BASE",G.rally.x,G.rally.y-40,10*us,"rgba(18,24,22,.88)","#f0ecd6");
    if(G.phase==="play"&&G.tPlay<16){
      const r=26+((now*44)%50);
      c.strokeStyle="#d4a24c";c.lineWidth=3;
      c.globalAlpha=Math.max(0,1-(r-26)/50);
      c.beginPath();c.arc(G.rally.x,G.rally.y,r,0,7);c.stroke();
      c.globalAlpha=1;
    }
  }
  // drag rectangle
  if(dragStart&&dragCur){
    c.strokeStyle="#f59e0b";c.lineWidth=2.5;c.setLineDash([6,4]);
    c.strokeRect(Math.min(dragStart.x,dragCur.x),Math.min(dragStart.y,dragCur.y),
      Math.abs(dragCur.x-dragStart.x),Math.abs(dragCur.y-dragStart.y));
    c.setLineDash([]);
  }
}

/* ---------------- main loop & boot ---------------- */
if(!HEADLESS){
  let lastT=0;
  function frame(t){
    const dt=Math.min(0.05,(t-lastT)/1000||0.016);lastT=t;
    if(G)tick(dt);
    render(dt);
    ui.syncBanner(dt);
    if(G){ui.syncHud();ui.syncLog();
      ui.chipT-=dt;if(ui.chipT<=0){ui.chipT=0.25;ui.syncChips();ui.refreshGate()}
      ui.canvas.style.cursor=G.hoverGate>=0?"pointer":"crosshair"}
    requestAnimationFrame(frame);
  }
  // leaving the app (or tab) mid-quarter pauses the clock
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden&&G&&G.phase==="play"&&!G.over&&!G.paused)togglePause();
  });
  window.addEventListener("DOMContentLoaded",()=>{
    ui.init();
    buildMap();
    ui.showTitle();
    requestAnimationFrame(frame);
  });
}

/* ---------------- test hooks ---------------- */
const __wg={
  newMatch,startQuarter,tick,CFG,GATES,ARMIES,NAV,ui,
  get state(){return G},
  resolvePlay,eligibleToScore,menInGateArea,
  cmdCharge,cmdCallers,cmdScout,cmdRecall,cmdSetGarrison,attackIntel,attackPool,garrisonOf,recommendCharge,
  setGeneral,normGeneral,SETTINGS,
  render,buildMap,getMapImage(){return MAPIMG},
  runHeadless(opts){
    opts=Object.assign({playerArmy:"G",difficulty:1,autotest:true},opts||{});
    newMatch(opts);
    startQuarter();
    let steps=0,err=null;
    while(!G.over&&steps<80000){tick(0.1);steps++}
    return {finished:G.over,steps,score:{...G.score},qScores:G.qScores.map(q=>({...q})),
      stats:{plays:G.stats.plays,repulses:G.stats.repulses,challenges:G.stats.challenges},
      logCount:G.log.length};
  },
};
if(typeof window!=="undefined")window.__wg=__wg;
</script>
